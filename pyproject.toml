[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eonwild-motion"
version = "0.1.0"
description = "Deterministic procedural animation build and release engine"
requires-python = ">=3.12"
dependencies = [
    "jsonschema==4.26.0",
    "numpy==2.5.2",
    "scipy==1.18.1",
]

[dependency-groups]
test = ["pytest==9.1.1"]

[project.scripts]
eonwild-motion = "eonwild_motion.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
