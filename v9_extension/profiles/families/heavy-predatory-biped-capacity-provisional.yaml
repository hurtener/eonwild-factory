aggregate_capabilities:
  launch_impulse_budget: derived from loaded hindlimb groups, contact duration, posture, fatigue, and injury
  landing_absorption_budget: derived from negative work/impulse of lead leg, catch leg, pelvis/trunk, and allowed extra
    steps
  turning_moment_budget: derived from stance, friction, hindlimb moment, trunk/tail redistribution, and yaw inertia
  bite_delivery_budget: derived separately from jaw/neck/trunk capacities and target reaction; no exact biological value
    supplied here
condition_modifiers:
  fatigue: reduces positive power first, then impulse/work envelope; configured curve
  injury: site-specific reduction and range/load restriction; never a universal scalar
  pain_confidence: may reject or soften intent before physical capacity is fully exhausted
  condition_factor: affects reserve and endurance inside the structural mass tier; does not change ontogenetic tier
provenance:
  status: gameplay_hypothesis
  note: The schema is required because passive mass/inertia can calculate required dynamics but cannot determine whether
    the animal can produce or absorb them. Numerical capacities remain intentionally unresolved until calibrated and
    reviewed.
  sources:
  - doi:10.1371/journal.pone.0026037
  - doi:10.1242/jeb.152538
  uncertainty:
    absolute_capacity: not enabled
    calibration: requires gameplay, comparative biomechanics, and perceptual sweeps
  reviewed_by: null
  reviewed_at: null
