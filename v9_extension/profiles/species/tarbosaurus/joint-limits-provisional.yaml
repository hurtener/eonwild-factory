- schema: eonwild.joint_limit_envelope.v1
  id: tarbosaurus_pelvis_to_abdomen
  articulation: pelvis_to_abdomen
  frame:
    parent_role: pelvis
    child_role: spine_01
    neutral_definition: Resolved rest-pose relative orientation from the pinned semantic rig.
  parameterization: swing_twist
  hard_envelope:
    status: unresolved
    meaning: Articulation/non-interpenetration boundary only; never use as the habitual animation range.
    required_when_calibrated:
    - orientation_surface_or_axis_bounds
    - collision_or_articular_test
    - uncertainty
  preferred_envelope:
    status: unresolved
    meaning: Loaded, soft-tissue, behavioral, and performance envelope used for normal motion.
    required_when_calibrated:
    - orientation_surface_or_axis_bounds
    - load_and_speed_conditioning
    - uncertainty
  load_conditioning:
    status: required
    note: Preferred range contracts under high axial load, acceleration, feeding descent, and turning.
  couplings:
  - status: required
    note: Couple pitch/roll/yaw with adjacent trunk articulations; do not solve each axis independently.
  rate_limits:
    angular_velocity:
      status: unresolved
      units: rad_s
    angular_acceleration:
      status: unresolved
      units: rad_s2
  provenance:
    status: gameplay_hypothesis
    note: Contract placeholder. No exact Tarbosaurus range is asserted; calibrate from anatomy, collision, comparative
      motion, and perceptual review.
    sources:
    - doi:10.1038/s41467-024-44832-z
    uncertainty:
      numerical_limits: unresolved
      soft_tissue: unresolved
    reviewed_by: null
    reviewed_at: null
