  preserved_invariants:
  - contacts and sharp action beats survive
  - quaternion signs are continuous
  - loops remain exact
  - maximum change is reported
  required_evidence:
  - protected-track equality
  - loop derivative test
  - maximum angular delta
  - action contact timing
  v9_disposition: Reusable V9 bake refinement after constraint solve.
  disposition_class: restore_contract
- id: R022
  category: jaw and mouth
  capability: Mesh-witness jaw calibration
  v5_5_source:
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/scripts/eonproc_v5_5/jaw.py
  - procedural-animation-toolkit(v5.5)/validated_result/v5.5/animation-manifest.v5.5.json
  what_v5_5_proved_or_attempted: V5.5 discovers the mandible/skull chains, samples weighted mesh witnesses, and calibrates
    a living-neutral close near 50 degrees for this fixture.
  disposition_for_v8_3: restore_tooling_and_resolve
  priority: P0
