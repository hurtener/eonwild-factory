items:
- id: R001
  category: release discipline
  capability: Immutable historical baselines
  v5_5_source:
  - procedural-animation-toolkit(v5.5)/
  - procedural-animation-toolkit(v8.2)/
  what_v5_5_proved_or_attempted: Both versions are reproducible release packages with their own artifacts and evidence.
  disposition_for_v8_3: restore_contract
  priority: P0
  v8_3_target: repository/versioning policy
  recovery_method: Never edit historical release directories. Consume their artifacts by pinned path and SHA. Build V8.3 in
    a new canonical directory.
  preserved_invariants:
  - V8.2 and V5.5 bytes remain unchanged
  - all migrations are additive
  - every source artifact is SHA-pinned
  required_evidence:
  - git diff proves no historical file changed
  - input SHA checks fail closed
  v9_disposition: Remain permanent regression fixtures.
  disposition_class: restore_contract
- id: R002
  category: release discipline
  capability: Deterministic input/output hashing
  v5_5_source:
  - procedural-animation-toolkit(v8.2)/config/release.json
  - procedural-animation-toolkit(v8.2)/scripts/verify_release.py
  - procedural-animation-toolkit(v5.5)/validated_result/v5.5/v5.5-release-validation.json
  what_v5_5_proved_or_attempted: V8.2 binds the base and approved output hashes; V5.5 records a generated artifact hash and
    validation result.
  disposition_for_v8_3: restore_contract
  priority: P0
  v8_3_target: src/eonmotion/release + artifacts/v8.3/manifest.json
  recovery_method: Every V8.3 build records source/config/tool hashes, output hashes, changed-channel scope, evidence hashes,
    and build environment facts.
  preserved_invariants:
  - same inputs produce same binary where deterministic mode is declared
  - non-deterministic render media is separated from deterministic mechanical output
  required_evidence:
  - two clean rebuilds
  - manifest inventory exactness
  - hash mismatch negative test
  v9_disposition: Use the same release protocol for every V9 plan family.
  disposition_class: restore_contract
- id: R003
  category: release discipline
  capability: Fail-closed package inventory
  v5_5_source:
  - procedural-animation-toolkit(v8.2)/scripts/verify_release.py
  what_v5_5_proved_or_attempted: V8.2 rejects forbidden cache/temp/rejected paths, oversized files, missing inventory entries,
    and mismatched media facts.
  disposition_for_v8_3: restore_contract
  priority: P0
  v8_3_target: scripts/verify_v8_3_release.py
  recovery_method: Port the inventory and forbidden-path behavior. Extend it to schemas, configs, animation specs, resolved
    profiles, reports, and media.
  preserved_invariants:
  - no hidden production debt
  - no rejected candidate accidentally ships
  - every file is represented exactly once
  required_evidence:
  - inject a .tmp file and confirm failure
  - remove an inventory entry and confirm failure
  - corrupt media metadata and confirm failure
  v9_disposition: Generalize as the canonical Eonwild factory release verifier.
  disposition_class: restore_contract
- id: R004
  category: release discipline
  capability: Changed-versus-unchanged channel accounting
  v5_5_source:
  - procedural-animation-toolkit(v8.2)/config/release.json
  - procedural-animation-toolkit(v8.2)/scripts/verify_release.py
  what_v5_5_proved_or_attempted: V8.2 permits changes only on a declared set of chest/neck/head rotation accessors.
  disposition_for_v8_3: restore_contract
  priority: P0
  v8_3_target: validation/channel-scope-report.json
  recovery_method: Every V8.3 operation declares which nodes, paths, clips, and channel types it may modify. The verifier
    compares all other binary accessors or sampled tracks.
  preserved_invariants:
  - no accidental root/foot/toe changes
  - no silent edit to non-target clips
  - no JSON/schema drift unless declared
  required_evidence:
  - byte or sample equivalence outside scope
  - negative test with one forbidden accessor edit
  v9_disposition: Required for isolated solver-layer audits in V9.
  disposition_class: restore_contract
- id: R005
  category: configuration
  capability: Externalized reusable profile
  v5_5_source:
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/examples/profiles/tarbosaurus-v5.5.json
  what_v5_5_proved_or_attempted: V5.5 exposed gait, contact, terrain, tail, idle, action, jaw, and transition parameters instead
    of burying all values in code.
  disposition_for_v8_3: restructure_and_restore
  priority: P0
  v8_3_target: profiles/ + motions/ + config/v8_3/
  recovery_method: Do not copy the monolithic JSON as the new canonical shape. Split it into versioned family, species, rig,
    contact, gait, action, transition, and release configs with units, ranges, provenance, uncertainty, and unknown-field
    rejection.
  preserved_invariants:
  - generic code has no species-name branches
  - units are explicit
  - all references resolve fail closed
  - derived values are exported
  required_evidence:
  - schema validation
  - unknown field test
  - missing reference test
  - resolved-profile snapshot
  v9_disposition: Becomes the BodyInstanceProfile, GrowthProfile, MotionProgram, and capacity stack.
  disposition_class: restructure_and_restore
- id: R006
  category: configuration
  capability: Semantic bone-role resolution
  v5_5_source:
  - assets/examples/tarbosaurus/bone-map.edited-2.yml
  - procedural-animation-toolkit(v5.5)/inputs/tarbosaurus_bone_map.edited.yml
  what_v5_5_proved_or_attempted: The rig is addressed through roles such as pelvis, chest, neck chain, foot, toes, tail, jaw,
    and limbs.
  disposition_for_v8_3: restore_contract
  priority: P0
  v8_3_target: src/eonmotion/rig/semantic_map.py
  recovery_method: Port role-based resolution, hierarchy validation, confidence/evidence fields, and required/optional role
    sets. Generic solvers may not reference Bone_### literals.
  preserved_invariants:
  - same semantic contract can resolve a second digitigrade biped
  - hierarchy mismatch fails
  - left/right completeness is checked
  required_evidence:
  - Tarbosaurus resolution report
  - synthetic second-fixture resolution
  - broken-parent negative test
  v9_disposition: Foundation of species-family reuse.
  disposition_class: restore_contract
- id: R007
  category: rig and skin
  capability: 75-joint skin order and deformation preservation
  v5_5_source:
  - procedural-animation-toolkit(v5.5)/validated_result/v5.5/v5.5-release-validation.json
  - procedural-animation-toolkit(v8.2)/asset/tarbosaurus_v8_2_approved.glb
  what_v5_5_proved_or_attempted: V5.5 validated 75 skin joints and rest-skinned-mesh preservation; V8.2 preserves the existing
    GLB structure and JSON.
  disposition_for_v8_3: restore_contract
  priority: P0
  v8_3_target: validation/skin-integrity-report.json
  recovery_method: V8.3 must preserve joint count/order, mesh primitives, weights, materials, morph targets, inverse-bind
    behavior, and rest-pose skin unless a migration is explicitly approved.
  preserved_invariants:
  - no deformation regression
  - no lost jaw/toe/tail bones
  - no hidden re-rig
  required_evidence:
  - joint-order equality
  - rest-skinned vertex error
  - mesh/material/accessor inventory
  v9_disposition: Required for every baked V9 output.
  disposition_class: restore_contract
- id: R008
  category: rig and skin
  capability: Foot-pivot calibration tooling
  v5_5_source:
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/scripts/eonproc_v5_5/pivots.py
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/scripts/adjust_v5_5_foot_pivots.py
  what_v5_5_proved_or_attempted: V5.5 lowered foot pivots while preserving toe-root world positions and the rest-skinned mesh;
    it intentionally changed inverse-bind slots 43 and 56.
  disposition_for_v8_3: port_tooling_not_mutation
  priority: P1
  v8_3_target: tools/rig/inspect_and_propose_foot_pivots.py
  recovery_method: Keep the diagnostic and migration capability, but do not reapply V5.5 inverse-bind changes to the V8.2
    artifact by default. Produce a proposal report and require explicit approval before any structural mutation.
  preserved_invariants:
  - V8.2 rig is authoritative until a need is demonstrated
  - toe world origins remain stable
  - rest mesh remains equivalent
  required_evidence:
  - before/after pivot visualization
  - rest-skinned error
  - contact comparison
  - explicit migration flag test
  v9_disposition: A general rig-import calibration tool, separate from motion solving.
  disposition_class: port_and_revalidate
- id: R009
  category: contacts
  capability: Skinned-vertex sole witness extraction
  v5_5_source:
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/scripts/eonproc_v4/sole.py
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/examples/profiles/tarbosaurus-v5.5.json
  what_v5_5_proved_or_attempted: V5.5 inherits V4 vertex-level sole witnesses, thresholds, height bands, padding, contact
    quantiles, and minimum witness counts.
  disposition_for_v8_3: port_and_revalidate
  priority: P0
  v8_3_target: src/eonmotion/contacts/sole_witnesses.py
  recovery_method: Recover the vertex-based contact-patch method, but resolve witness sets against the V8.2 mesh/skin and
    freeze the resolved witness IDs in the V8.3 profile.
  preserved_invariants:
  - support uses patches rather than ankle points
  - left/right witness sets are deterministic
  - witnesses belong to the intended foot/toe region
  required_evidence:
  - witness visualization
  - stable ID/hash across rebuilds
  - minimum witness count
  - bad-weight negative fixture
  v9_disposition: Feeds physical contact patches and support regions in V9.
  disposition_class: port_and_revalidate
- id: R010
  category: contacts
  capability: Contact phase schedule and loaded-foot locking
  v5_5_source:
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/scripts/eonproc_v4/locomotion.py
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/examples/profiles/tarbosaurus-v5.5.json
  what_v5_5_proved_or_attempted: V5.5 models stance fraction, contact lead, load ramp, pre-contact, toe-off, and sole/loaded-gap
    gates.
  disposition_for_v8_3: reimplement_against_v8_2
  priority: P0
  v8_3_target: src/eonmotion/contacts/contact_schedule.py
  recovery_method: Recover the semantics, not the exact old phase curves. Infer or bind the approved V8.2 contact phases,
    expose CONTACT/LOAD/UNLOAD/TOE_OFF states, and keep loaded witnesses fixed in world space within tolerance.
  preserved_invariants:
  - no foot skate while loaded
  - no arbitrary loaded-foot yaw
  - toe-off releases progressively
  - markers match measured contact
  required_evidence:
  - per-foot world-space drift
  - loaded yaw drift
  - penetration/gap report
  - event-versus-geometry consistency
  v9_disposition: Becomes the ContactState contract used by centroidal planning.
  disposition_class: reimplement_against_v8_2
- id: R011
  category: contacts
  capability: Metatarsal, foot, and toe articulation sequence
  v5_5_source:
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/scripts/eonproc_v4/locomotion.py
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/examples/profiles/tarbosaurus-v5.5.json
  what_v5_5_proved_or_attempted: V5.5 parameterizes ankle swing, foot contact angle, toe-off foot rotation, toe push, and
    multiple toe branches.
  disposition_for_v8_3: reimplement_against_v8_2
  priority: P0
  v8_3_target: src/eonmotion/solve/foot_toe_solver.py
  recovery_method: Use the V8.2 tracks as the reference contact behavior. Recover heel/metatarsal/toe sequencing and all toe
    branches through semantic roles, with contact-state-conditioned limits.
  preserved_invariants:
  - foot is not a rigid board
  - toes are last to leave
  - loaded toes do not rotate freely
  - all branches remain anatomically coherent
  required_evidence:
  - toe witness trajectories
  - toe-off ordering
  - joint/rate limits
  - side and three-quarter video
  v9_disposition: Primary pose/contact solver component.
  disposition_class: reimplement_against_v8_2
- id: R012
  category: contacts
  capability: Terrain probing and substrate adaptation
  v5_5_source:
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/scripts/eonproc_v4/terrain.py
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/runtime/terrain-contact-adapter.ts
  what_v5_5_proved_or_attempted: V5.5 inherits terrain probes, normal blending, foot roll/pitch limits, pelvis height/roll/pitch
    response, and uneven/slope fixtures.
  disposition_for_v8_3: port_and_revalidate
  priority: P1
  v8_3_target: src/eonmotion/contacts/terrain_adapter.py + runtime adapter
  recovery_method: Port terrain interfaces and bounded adaptation. Separate terrain query, planned contact patch, foot orientation
    solve, pelvis response, and final penetration correction.
  preserved_invariants:
  - flat-terrain V8.2 regression is unchanged when adaptation is zero
  - terrain corrections never exceed declared limits
  - support remains valid
  required_evidence:
  - flat no-op equivalence
  - slope fixture
  - uneven fixture
  - edge/step negative cases
  v9_disposition: Runtime receives a bounded version; full planning remains offline.
  disposition_class: port_and_revalidate
- id: R013
  category: constraints
  capability: Signed knee/ankle and hip envelopes
  v5_5_source:
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/scripts/eonproc_v3/rig.py
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/examples/profiles/tarbosaurus-v5.5.json
  what_v5_5_proved_or_attempted: The inherited solver uses signed anatomical bases and explicit hip, knee, and ankle limits
    with velocity/acceleration gates.
  disposition_for_v8_3: port_and_revalidate
  priority: P0
  v8_3_target: src/eonmotion/solve/joint_constraints.py
  recovery_method: Recover anatomical coordinate construction, hinge sign, hard ranges, continuity, velocity, and acceleration
    checks. Keep V8.3 values as animation-engineering constraints, not biological certainty.
  preserved_invariants:
  - no knee inversion
  - no snapping to a straight leg
  - no discontinuous quaternion sign
  - rates stay bounded
  required_evidence:
  - range sweep
  - joint-rate report
  - broken-axis negative fixture
  - visual pose grid
  v9_disposition: Expand into hard versus preferred coupled envelopes in V9.
  disposition_class: port_and_revalidate
- id: R014
  category: walk baseline
  capability: Approved V8.2 relaxed walk
  v5_5_source:
  - procedural-animation-toolkit(v8.2)/asset/tarbosaurus_v8_2_approved.glb
  - procedural-animation-toolkit(v8.2)/config/release.json
  what_v5_5_proved_or_attempted: V8.2 is the approved Candidate-A walk with bounded world-relative chest balance and preserved
    root, pelvis, legs, feet, toes, tail, and non-walk data.
  disposition_for_v8_3: authoritative_baseline
  priority: P0
  v8_3_target: fixtures/v8.2/tarbosaurus_v8_2_approved.glb
  recovery_method: Pin the exact SHA. V8.3 first reproduces it as compatibility mode before any whole-body balance migration.
    Any balanced variant must report every changed channel and prove contact/root equivalence.
  preserved_invariants:
  - approved perceptual target is never overwritten
  - compatibility output remains byte-identical where feasible
  - root trajectory and contacts remain authoritative
  required_evidence:
  - exact SHA reproduction
  - fixed-camera side/3Q comparison
  - channel diff
  v9_disposition: Remains the adult-walk regression for V9.
  disposition_class: authoritative_baseline
- id: R015
  category: body balance
  capability: Pelvis support shift and load response
  v5_5_source:
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/examples/profiles/tarbosaurus-v5.5.json
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/README.md
  what_v5_5_proved_or_attempted: V5.5 adds a principal support leg, pelvis translations, support shift, loading drop, roll/yaw/pitch,
    and less extreme rear stance.
  disposition_for_v8_3: recover_as_legacy_proxy
  priority: P0
  v8_3_target: src/eonmotion/legacy_balance/support_phase_balance.py
  recovery_method: Recreate the intended behavior from measured foot phases and configured bounded gains. When the pelvis
    changes, counter-solve the loaded leg/foot/toe chains to preserve world contacts. Label the result a support-phase balance
    proxy, not physical COM.
  preserved_invariants:
  - feet remain planted
  - root displacement remains aligned
  - pelvis responds to the loaded side
  - no body sway is added without support reason
  required_evidence:
  - pelvis/load phase correlation
  - foot drift after counter-solve
  - before/after V8.2 video
  - gain sweep
  v9_disposition: Replace the proxy with segment-level COM/support solving in V9.
  disposition_class: recover_as_legacy_proxy
- id: R016
  category: body balance
  capability: Exported pelvis translations in root-motion and in-place clips
  v5_5_source:
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/README.md
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/scripts/build_v5_5.py
  what_v5_5_proved_or_attempted: V5.5 explicitly exports pelvis translations for locomotion and actions, including in-place
    views.
  disposition_for_v8_3: restore_behavior
  priority: P0
  v8_3_target: src/eonmotion/bake/world_plan_views.py
  recovery_method: Use one authoritative world-space solve. Derive root-motion and in-place views from it by factoring root
    displacement, never by solving the body twice.
  preserved_invariants:
  - same relative body/contact motion in both views
  - no independent phase drift
  - pelvis translation is not discarded
  required_evidence:
  - root-motion versus in-place reconstruction equivalence
  - contact comparison
  - phase equality
  v9_disposition: Required for V9 plan baking and runtime previews.
  disposition_class: restore_contract
- id: R017
  category: body balance
  capability: Hip-led leg recovery and shortened rear stance
  v5_5_source:
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/README.md
  - procedural-animation-toolkit(v5.5)/validated_result/v5.5/v5.5-release-validation.json
  what_v5_5_proved_or_attempted: V5.5 reduced excessive rear reach and specified hip-led recovery with delayed knee, ankle,
    foot, and toe response.
  disposition_for_v8_3: recover_intent_not_curve
  priority: P0
  v8_3_target: motions/programs/alternating_gait.yaml
  recovery_method: Encode the sequencing and reach limits in the gait program. Fit against the V8.2 approved leg trajectories
    rather than importing V5.5 samples.
  preserved_invariants:
  - economical swing
  - no piston legs
  - no overextended rear foot
  - toe clearance remains sufficient
  required_evidence:
  - rear reach metrics
  - phase ordering
  - joint velocity
  - side-video review
  v9_disposition: Continuous parameter inside growth-aware gait regimes.
  disposition_class: reimplement_from_spec
- id: R018
  category: body balance
  capability: Chest counter-rotation and neck/head stabilization
  v5_5_source:
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/examples/profiles/tarbosaurus-v5.5.json
  - procedural-animation-toolkit(v8.2)/scripts/release_generate.py
  what_v5_5_proved_or_attempted: V5.5 has spine/neck/head gains; V8.2 provides the approved bounded world-relative chest solve
    and neck reconstruction.
  disposition_for_v8_3: merge_with_v8_2_authority
  priority: P0
  v8_3_target: src/eonmotion/solve/trunk_stabilization.py
  recovery_method: Use V8.2 as the authoritative adult-walk reference. Productize its world-relative basis, allowed nodes,
    residual fractions, and limits; make gains profile-driven and clip/program-scoped.
  preserved_invariants:
  - head is not a gimbal
  - large orientation changes involve the chain
  - V8.2 local-delta bounds are honored for compatibility mode
  required_evidence:
  - exact V8.2 reproduction
  - gain/limit negative tests
  - head world-pose comparison
  v9_disposition: Driven by measured balance/momentum error in V9.
  disposition_class: reimplement_against_v8_2
- id: R019
  category: body balance
  capability: Damped segmented tail response
  v5_5_source:
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/examples/profiles/tarbosaurus-v5.5.json
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/scripts/eonproc_v4/locomotion.py
  what_v5_5_proved_or_attempted: V5.5 exposes tail stiffness root/tip, damping, coupling, parent follow, lag, dynamic limits,
    COM/velocity gains, sag, and warmup.
  disposition_for_v8_3: port_stateful_solver_relabel_gains
  priority: P0
  v8_3_target: src/eonmotion/solve/tail_response.py
  recovery_method: Recover the stateful damped chain, proximal-to-distal stiffness gradient, lag, limits, and warmup. Treat
    old COM gain as a tuned presentation proxy until V9 supplies real COM/momentum requests.
  preserved_invariants:
  - tail base remains muscular and pelvis-coupled
  - no endless oscillation
  - state carries across transitions
  - no decorative wag
  required_evidence:
  - impulse response/damping plot
  - loop seam state
  - turn/start/stop review
  - limit checks
  v9_disposition: Connect input torque to centroidal angular-momentum and balance requests.
  disposition_class: port_and_revalidate
- id: R020
  category: presentation
  capability: Breathing, micro-attention, forelimb inertia, and asymmetry
  v5_5_source:
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/examples/profiles/tarbosaurus-v5.5.json
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/scripts/build_v5_5.py
  what_v5_5_proved_or_attempted: V5.5 includes breathing, head micro-motion, arm inertia, asymmetry, and secondary residual
    detail.
  disposition_for_v8_3: restore_as_bounded_overlays
  priority: P0
  v8_3_target: src/eonmotion/overlays/
  recovery_method: Recover as separate seeded, aperiodic, masked overlays with per-channel authority. They may not move root,
