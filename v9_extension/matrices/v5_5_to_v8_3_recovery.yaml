  - breathing is not torso bob
  - micro-attention is non-rhythmic
  - variation is reproducible from seed
  required_evidence:
  - mask audit
  - COM/contact authority audit
  - loop seam
  - seed determinism
  - visual repetition review
  v9_disposition: Remain final bounded presentation layers.
  disposition_class: restore_contract
- id: R021
  category: presentation
  capability: Quaternion-space smoothing with protected contact bones
  v5_5_source:
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/scripts/eonproc_v5_5/polish.py
  - procedural-animation-toolkit(v5.5)/toolkit/v5.5/scripts/build_v5_5.py
  what_v5_5_proved_or_attempted: V5.5 applies sign-continuous zero-phase smoothing to expressive bones while protecting root,
    legs, feet, toes, and jaw/action beats.
  disposition_for_v8_3: restore_tooling
  priority: P0
  v8_3_target: src/eonmotion/bake/polish.py
  recovery_method: Port smoothing as an explicit post-process with masks, loop/cyclic support, endpoint restoration, delta
