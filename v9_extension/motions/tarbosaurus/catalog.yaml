  purpose: Provide an injury reference state whose support, pelvis, spine, tail, breathing, guarding, and pain events can
    be continuously parameterized at runtime.
  duration_s:
    target: 7.0
    min: 5.0
    max: 10.0
  loop: true
  root_motion: false
  entry:
    allowed:
    - injury_event
