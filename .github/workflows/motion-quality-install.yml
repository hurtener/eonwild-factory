name: Install and verify motion quality
on:
  push:
    branches: [feat/motion-quality-and-breadth]
    paths: [.github/workflows/motion-quality-install.yml]
permissions:
  contents: read
jobs:
  install:
    if: github.ref == 'refs/heads/feat/motion-quality-and-breadth'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          show-progress: false
      - run: python tools/_apply_quality.py
      - name: Commit the materialized source; remove temporary recovery code
        id: commit
        env:
          TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os, pathlib, subprocess, base64
          for name in ['tools/_apply_quality.py','.github/workflows/motion-quality-install.yml','.github/workflows/motion-source-recovery.yml','.github/workflows/motion-quality-inspect.yml']:
              pathlib.Path(name).unlink(missing_ok=True)
          subprocess.run(['git','config','user.name','Eonwild factory automation'],check=True)
          subprocess.run(['git','config','user.email','eonwild-factory@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','src','tools','catalog','recipes','.github/workflows'],check=True)
          subprocess.run(['git','commit','-m','feat: V9 articulated gait, semantic lateral performance and material contact authority'],check=True)
          token=base64.b64encode(('x-access-token:'+os.environ['TOKEN']).encode()).decode()
          subprocess.run(['git','-c','http.https://github.com/.extraheader=AUTHORIZATION: basic '+token,'push','origin','HEAD:refs/heads/feat/motion-quality-and-breadth'],check=True,capture_output=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          print('SOURCE_HEAD',sha)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('sha='+sha+'\n')
  contracts:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.install.outputs.sha }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest==9.1.1 > /tmp/install.log
      - run: python -m pytest tests -q --ignore=tests/test_integration.py -k 'not test_zero_bounds_fails_blender_stage'
  generate:
    needs: install
    strategy:
      fail-fast: false
      matrix:
        recipe: [walk.v2, reverse-walk.v3, run.v3, sprint.v3]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.install.outputs.sha }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e . > /tmp/install.log
      - name: Generate and inspect exact final witnesses
        env:
          RECIPE: ${{ matrix.recipe }}
        shell: python
        run: |
          import os,json,pathlib,traceback
          from eonwild_motion.factory.compiler import compile_recipe
          name=os.environ['RECIPE'];out=pathlib.Path('out/quality')/name
          compile_recipe(pathlib.Path('recipes/heavy-biped')/(name+'.json'),root=pathlib.Path.cwd(),output=out)
          print('FINAL_VALIDATION',name,(out/'validation.json').read_text())
          receipt=json.loads((out/'solver-receipt.json').read_text())
          print('REFINEMENT',json.dumps(receipt.get('skin_target_refinement')))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quality-${{ matrix.recipe }}
          path: out/quality
          retention-days: 14
