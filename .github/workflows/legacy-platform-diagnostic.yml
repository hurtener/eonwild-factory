name: Legacy numeric toolchain diagnosis
on:
  push:
    branches: [diag/v9-legacy-reproduction-20260907]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - if: runner.os == 'Linux'
        run: bash tools/ci_setup_blender.sh
      - name: Official checksum-verified Blender for Mac
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mac-blender" "$RUNNER_TEMP/blender-app"
          cd "$RUNNER_TEMP/mac-blender"
          cpu="$(uname -m)"
          test "$cpu" = arm64
          name=blender-5.2.0-macos-arm64.dmg
          curl --fail --location --retry 2 "https://download.blender.org/release/Blender5.2/$name" -o "$name"
          curl --fail --location --retry 2 https://download.blender.org/release/Blender5.2/blender-5.2.0.sha256 -o checksums.txt
          grep -E " [*]?$name$" checksums.txt > selected.sha256
          test "$(wc -l < selected.sha256 | tr -d ' ')" -eq 1
          shasum -a 256 --check selected.sha256
          hdiutil attach "$name" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/blender-volume"
          ditto "$RUNNER_TEMP/blender-volume/Blender.app" "$RUNNER_TEMP/blender-app/Blender.app"
          hdiutil detach "$RUNNER_TEMP/blender-volume"
          echo "$RUNNER_TEMP/blender-app/Blender.app/Contents/MacOS" >> "$GITHUB_PATH"
      - name: Compare host and bundled mathematics without changing reference bytes
        shell: python
        run: |
          import pathlib, subprocess, sys, os, json
          out=pathlib.Path('out/toolchain');out.mkdir(parents=True,exist_ok=False)
          request=out/'resolved.json'
          subprocess.run([sys.executable,'tools/diagnose_reproduction.py','--write-request',str(request)],check=True)
          commands={'host':[sys.executable,'tools/diagnose_reproduction.py'],
                    'blender':['blender','-b','--python-exit-code','1','--python','tools/diagnose_reproduction.py','--']}
          rows=[]
          for name,command in commands.items():
              result=subprocess.run(command+['--resolved',str(request),'--output',str(out/name)],capture_output=True,text=True,timeout=360)
              (out/f'{name}.log').write_text(result.stdout+result.stderr)
              print('TOOLCHAIN',name,'EXIT',result.returncode);print(result.stdout);print(result.stderr)
              rows.append({'name':name,'exit_code':result.returncode})
          (out/'execution.json').write_text(json.dumps(rows,indent=2)+'\n')
          if any(row['exit_code'] for row in rows): sys.exit('exact reproduction differs in at least one environment')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: legacy-toolchain-${{ matrix.os }}
          path: |
            out/toolchain/**/*.json
            out/toolchain/*.log
          if-no-files-found: warn
          retention-days: 14
