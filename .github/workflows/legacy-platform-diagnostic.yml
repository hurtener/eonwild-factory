name: Materialize reviewed limb source and measure preserved references
on:
  push:
    branches: [diag/v9-legacy-reproduction-20260907]
permissions:
  contents: read
jobs:
  stage-and-measure:
    permissions:
      contents: write # Immutable source blob only; never commits or branch refs.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env: {PYTHONPATH: src, OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '2', GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -e . pytest==9.1.1
      - run: python tools/migrations/stage_articulated_contact.py
      - name: Record native geometric reference, never retime or copy it into generation
        shell: python
        run: |
          import json,pathlib,sys,hashlib,numpy as np
          sys.path.insert(0,'tools')
          from measure_motion_reference import measure
          from eonwild_motion.glb.container import Glb
          from eonwild_motion.layers.leg_contact_resolve_v3 import _clip_state,_pose,_world_matrices
          from eonwild_motion.solve.skin_rig import SkinRig
          root=pathlib.Path.cwd(); recipe=json.loads((root/'recipes/heavy-biped/walk.v2.json').read_text())
          roles=json.loads((root/recipe['rig']['path']).read_text())['roles']
          folder=root/'build/V9-NARROW-GAUGE-WALK-002/sweep-run-016-v4-skinned-authority/sweep-0p34000000000000002-fa4aa9445c12'
          source=folder/'narrow-gauge-walk-root_motion.glb'
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='b54e3740ea451927b3b812c1be3f4ca6146cc369ad1313be7f08edd5ca741cd3'
          glb=Glb.from_bytes(source.read_bytes());clip='PROC_WALK_RELAXED_V8_1_RESPIN_ROOTMOTION'
          tracks,times=_clip_state(glb,clip)
          begin=_world_matrices(glb,*_pose(glb,tracks,0));end=_world_matrices(glb,*_pose(glb,tracks,len(times)-1))
          node=glb.name_to_node[roles['root']]
          travel=np.asarray(end[node])[:3,3]-np.asarray(begin[node])[:3,3];travel[1]=0;travel/=np.linalg.norm(travel)
          report=measure(source,clip=clip,roles=roles,forward_axis=travel)
          out=root/'out/reference-measurements';out.mkdir(parents=True,exist_ok=False)
          (out/'approved-v9-walk.json').write_text(json.dumps(report,indent=2)+'\n')
          print('APPROVED_V9_NATIVE_MEASUREMENTS '+json.dumps(report),flush=True)
          neutral=Glb.from_bytes((root/recipe['source']['path']).read_bytes())
          contact=json.loads((root/recipe['contact_profile']['path']).read_text())
          rig=SkinRig(neutral,roles,np.asarray(recipe['forward_axis']),np.asarray(recipe['up_axis']),contact,oral=True)
          head=neutral.name_to_node[roles['head']]
          axis=rig.centroid(rig.neutral_world,'upper')-rig.neutral_world[head,:3,3];axis/=np.linalg.norm(axis)
          calibration={'head_to_upper_rostrum_world_unit':axis.tolist(),'elevation_degrees':float(np.degrees(np.arctan2(axis@rig.up,axis@rig.forward))),
              'classification':'geometry-derived rostral direction, not a calibrated optic axis'}
          print('NEUTRAL_ROSTRAL_CALIBRATION '+json.dumps(calibration),flush=True)
          (out/'neutral-rostral-calibration.json').write_text(json.dumps(calibration,indent=2)+'\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reviewed-source-and-v9-reference
          path: |
            src/eonwild_motion/solve/airborne_gait.py
            out/reference-measurements
          retention-days: 14
