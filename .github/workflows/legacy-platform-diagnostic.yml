name: Verified toolchain and supported-motion diagnosis
on:
  push:
    branches: [diag/v9-legacy-reproduction-20260907]
permissions:
  contents: read
jobs:
  full-suite:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -e . pytest==9.1.1
      - run: bash tools/ci_setup_blender.sh
      - name: All tests, including locked-byte legacy reproduction and real rendering
        run: |
          set -euo pipefail
          git config user.name 'Eonwild regression runner'
          git config user.email 'eonwild-regression@example.invalid'
          mkdir -p out/ci
          python -m pytest tests -q --tb=short --junitxml=out/ci/full-tests.xml 2>&1 | tee out/ci/full-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-suite-canonical-macos-arm64
          path: out/ci
          retention-days: 14
  supported-diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: {PYTHONPATH: src, OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '2'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -e .
      - run: python tools/diagnose_supported_action.py --recipe recipes/heavy-biped/feeding.v1.json --output out/feeding-diagnosis
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: supported-pose-diagnosis
          path: out/feeding-diagnosis
          retention-days: 14
