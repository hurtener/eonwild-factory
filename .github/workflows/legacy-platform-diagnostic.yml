name: Supported motion correction verification
on:
  push:
    branches: [diag/v9-legacy-reproduction-20260907]
permissions:
  contents: read
jobs:
  supported-correction:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env: {PYTHONPATH: src, OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '2'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -e . pytest==9.1.1
      - run: python -m pytest tests/test_support_balance.py tests/test_behavior_programs.py -q
      - name: Bind authored bite recipe and inspect actual emitted contact
        shell: python
        run: |
          import json,hashlib,pathlib,subprocess,sys
          from eonwild_motion.factory.compiler import compile_recipe,verify_package
          root=pathlib.Path.cwd()
          profile=root/'catalog/programs/heavy-biped.bite-miss.v2.json'
          recipe=json.loads((root/'recipes/heavy-biped/bite-miss.v1.json').read_text())
          recipe.update(id='heavy-biped.bite-miss.v2',version=2,supersedes='heavy-biped.bite-miss.v1',description='Forward-target bite with bracing, controlled closure and supported recovery')
          recipe['program_profile']={'path':str(profile.relative_to(root)),'sha256':hashlib.sha256(profile.read_bytes()).hexdigest()}
          prepared=root/'recipes/heavy-biped/bite-miss.v2.json'
          prepared.write_text(json.dumps(recipe,indent=2,sort_keys=True)+'\n')
          print('PREPARED_BITE_RECIPE '+prepared.read_text(),flush=True)
          destination=root/'out/supported-correction';destination.mkdir(parents=True,exist_ok=False)
          failed=False
          for name in ('feeding.v1','bite-miss.v2'):
              target=destination/name
              try:
                  compile_recipe(root/f'recipes/heavy-biped/{name}.json',root=root,output=target)
                  result=verify_package(target)
                  validation=json.loads((target/'validation.json').read_text())
                  print('CORRECTED_RESULT '+name+' '+json.dumps(result),flush=True)
                  print('CORRECTED_VALIDATION '+name+' '+json.dumps(validation),flush=True)
                  failed |= result['technical_status']!='PASS'
              except Exception as exc:
                  import traceback
                  print('CORRECTION_ERROR '+name+' '+traceback.format_exc(),flush=True)
                  (destination/f'{name}.error.log').write_text(traceback.format_exc())
                  failed=True
          if failed:sys.exit('Supported correction has unaccepted candidates')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: supported-correction-candidates
          path: |
            out/supported-correction
            recipes/heavy-biped/bite-miss.v2.json
          retention-days: 14
