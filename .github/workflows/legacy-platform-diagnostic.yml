name: Articulated material contact verification
on:
  push:
    branches: [diag/v9-legacy-reproduction-20260907]
permissions:
  contents: read
jobs:
  articulation:
    permissions:
      contents: write # Creates one immutable source blob, never a commit/ref.
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env: {PYTHONPATH: src, OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '2', GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -e . pytest==9.1.1
      - run: python tools/migrations/stage_articulated_contact.py
      - name: Regress the actual articulation and contact contracts
        run: python -m pytest tests/test_articulated_contact_partition.py tests/test_motion_performance.py tests/test_motion_contact_adversarial.py tests/test_v9_airborne_gait.py -q --tb=short
      - name: Compile actual locomotion after the articulated foot correction
        run: python tools/verify_catalog.py --group locomotion --output out/articulated-contact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: articulated-contact-candidates
          path: |
            out/articulated-contact
            src/eonwild_motion/solve/airborne_gait.py
          retention-days: 14
