name: Versioned transitions to accepted locomotion programs
on:
  push:
    branches: [diag/v9-legacy-reproduction-20260907]
permissions: {contents: read}
jobs:
  transition:
    permissions: {contents: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: {motion: [walk, reverse-walk, run], kind: [start, stop]}
    env: {PYTHONPATH: src, OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '2', GH_TOKEN: '${{ github.token }}', MOTION: '${{ matrix.motion }}', KIND: '${{ matrix.kind }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -e .
      - name: Bind transitions to the actual accepted gait inputs, not a copied clip
        shell: python
        run: |
          import json,pathlib,os,subprocess,sys,traceback
          sys.path.insert(0,'tools')
          from eonwild_motion.factory.compiler import compile_recipe,verify_package
          from verify_catalog import failures
          root=pathlib.Path.cwd();motion=os.environ['MOTION'];kind=os.environ['KIND']
          old=f'{motion}-{kind}.v1';new=f'{motion}-{kind}.v2'
          gait_name={'walk':'walk.v3','reverse-walk':'reverse-walk.v4','run':'run.v4'}[motion]
          gait=json.loads((root/f'recipes/heavy-biped/{gait_name}.json').read_text())
          recipe=json.loads((root/f'recipes/heavy-biped/{old}.json').read_text())
          recipe.update(id='heavy-biped.'+new,version=2,supersedes='heavy-biped.'+old,
              description='Versioned transition into the accepted '+gait_name+' input program; final handoff and visual review remain separate')
          recipe['gait_profile']=gait['program_profile']
          recipe['performance_profile']=gait['performance_profile']
          path=root/f'recipes/heavy-biped/{new}.json'
          path.write_text(json.dumps(recipe,indent=2,sort_keys=True)+'\n')
          output=root/'out/transitions'/new
          try:
              compile_recipe(path,root=root,output=output)
              status=verify_package(output);v=json.loads((output/'validation.json').read_text())
              print('TRANSITION_ACCEPTANCE '+json.dumps({'recipe':new,**status,'failures':failures(v),
                  'rates':v['rotation_rates'],'feasibility':v['solver_feasibility']}),flush=True)
              if status['technical_status']=='PASS':
                  response=subprocess.run(['gh','api','repos/hurtener/eonwild-factory/git/blobs','--method','POST','--input','-'],
                      input=json.dumps({'content':path.read_text(),'encoding':'utf-8'}),text=True,capture_output=True,check=True)
                  print('VERIFIED_TRANSITION_INPUT '+json.dumps({'path':str(path.relative_to(root)),'blob':json.loads(response.stdout)['sha']}),flush=True)
              else:sys.exit(2)
          except Exception:
              output.parent.mkdir(parents=True,exist_ok=True)
              (output.parent/(new+'.error.log')).write_text(traceback.format_exc())
              raise
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: transition-${{ matrix.motion }}-${{ matrix.kind }}-v2
          path: |
            out/transitions
            recipes/heavy-biped/*-start.v2.json
            recipes/heavy-biped/*-stop.v2.json
          retention-days: 14
