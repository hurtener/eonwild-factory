name: Final materialized foot recovery verification
on:
  push:
    branches: [diag/v9-legacy-reproduction-20260907]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: {recipe: [walk.v3, reverse-walk.v4, run.v4]}
    env: {PYTHONPATH: src, OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '2', RECIPE: '${{ matrix.recipe }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -e . pytest==9.1.1
      - run: python -m pytest tests/test_pad_recovery.py tests/test_centered_grounded_placement.py tests/test_articulated_contact_partition.py tests/test_motion_performance.py tests/test_motion_contact_adversarial.py -q --tb=short
      - name: Actual final skin and limb acceptance
        run: python tools/diagnose_limb_envelope.py --recipe "recipes/heavy-biped/$RECIPE.json" --output "out/pad-recovery/$RECIPE"
      - name: Print exact final gates when a candidate was emitted
        if: always()
        shell: python
        run: |
          import json,os,pathlib,sys
          sys.path.insert(0,'tools')
          from verify_catalog import failures
          path=pathlib.Path('out/pad-recovery')/os.environ['RECIPE']/'candidate/validation.json'
          if path.is_file():
              v=json.loads(path.read_text());print('FINAL_RECOVERY_GATES '+json.dumps({'recipe':os.environ['RECIPE'],'failures':failures(v),'rotation_rates':v['rotation_rates'],'continuity':v['cyclic_continuity']}),flush=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final-recovery-${{ matrix.recipe }}
          path: out/pad-recovery
          retention-days: 14
