name: Distal swing and canonical engine verification
on:
  push:
    branches: [diag/v9-legacy-reproduction-20260907]
permissions:
  contents: read
jobs:
  distal-swing:
    permissions: {contents: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        recipe: [walk.v2, run.v3, sprint.v3]
    env: {PYTHONPATH: src, OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '2', GH_TOKEN: '${{ github.token }}', RECIPE: '${{ matrix.recipe }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -e . pytest==9.1.1
      - run: python tools/migrations/stage_distal_swing.py
      - run: python -m pytest tests/test_articulated_contact_partition.py tests/test_motion_performance.py tests/test_motion_contact_adversarial.py -q
      - name: Check real emitted motion after independent ankle and foot recovery
        shell: python
        run: |
          import json,os,pathlib,sys,traceback
          sys.path.insert(0,'tools')
          from eonwild_motion.factory.compiler import compile_recipe,verify_package
          from verify_catalog import failures
          from measure_motion_reference import measure
          root=pathlib.Path.cwd();name=os.environ['RECIPE'];output=root/'out/distal-swing'/name
          try:
              compile_recipe(root/f'recipes/heavy-biped/{name}.json',root=root,output=output)
              result=verify_package(output)
              v=json.loads((output/'validation.json').read_text())
              receipt=json.loads((output/'solver-receipt.json').read_text())
              recipe=json.loads((output/'recipe.json').read_text());roles=json.loads((root/recipe['rig']['path']).read_text())['roles']
              metrics=measure(output/'root_motion.glb',clip=recipe['id']+'.root_motion',roles=roles,forward_axis=recipe['forward_axis'])
              (output/'native-measurements.json').write_text(json.dumps(metrics,indent=2)+'\n')
              print('DISTAL_SWING_RESULT '+json.dumps({'recipe':name,**result,'failures':failures(v),'rates':v['rotation_rates'],
                  'continuity':v['cyclic_continuity'],'refinement':{k:x for k,x in receipt['skin_target_refinement'].items() if k!='witnesses'},
                  'native':metrics}),flush=True)
              if result['technical_status']!='PASS':sys.exit(2)
          except Exception:
              output.parent.mkdir(parents=True,exist_ok=True)
              (output.parent/(name+'.error.log')).write_text(traceback.format_exc())
              raise
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: distal-swing-${{ matrix.recipe }}
          path: |
            out/distal-swing
            src/eonwild_motion/solve/airborne_gait.py
          retention-days: 14
  full-suite:
    runs-on: macos-15
    timeout-minutes: 25
    env: {PYTHONPATH: src, OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '2'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -e . pytest==9.1.1
      - run: bash tools/ci_setup_blender.sh
      - run: bash tools/ci_setup_gltf_validator.sh
      - name: All engine and historical integration tests, no exclusions
        run: |
          set -euo pipefail
          git config user.name 'Eonwild regression runner'
          git config user.email 'eonwild-regression@example.invalid'
          mkdir -p out/ci
          python -m pytest tests -q --tb=short --junitxml=out/ci/full-tests.xml 2>&1 | tee out/ci/full-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: materialized-full-suite
          path: out/ci
          retention-days: 14
  feeding-brace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env: {PYTHONPATH: src, OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '2'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -e .
      - name: Measure feasible bracing without changing joint limits
        shell: python
        run: |
          import json,pathlib,numpy as np
          from eonwild_motion.factory.compiler import load_recipe
          from eonwild_motion.factory.source import geometry_height
          from eonwild_motion.glb.container import Glb
          from eonwild_motion.planning.supported_action import load_supported_action
          from eonwild_motion.solve.supported_action import SupportedSolver
          root=pathlib.Path.cwd();recipe,paths=load_recipe(root/'recipes/heavy-biped/feeding.v1.json',root)
          source=Glb.from_bytes(paths['source'].read_bytes());roles=json.loads(paths['rig'].read_text())['roles']
          contact=json.loads(paths['contact_profile'].read_text());profile=json.loads(paths['program_profile'].read_text())
          height=geometry_height(source,roles,recipe['up_axis']);results=[]
          for reach in ([-.08,.18],[-.04,.16],[0.,.16]):
              variant=json.loads(json.dumps(profile));variant['support_reach_body_heights']=reach
              action=load_supported_action(variant)
              solver=SupportedSolver(source,roles,action,contact,np.asarray(recipe['up_axis']),np.asarray(recipe['forward_axis']),height)
              worst={'violation':0.}
              for phase in np.linspace(0,6,161):
                  t,r,s,state,facts=solver.pose(float(phase))
                  for side,values in facts['legs'].items():
                      for key,(lo,hi) in action.support_limits.items():
                          amount=max(0,lo-values[key],values[key]-hi)
                          if amount>worst['violation']:worst={'violation':amount,'phase':float(phase),'side':side,'joint':key,'value':values[key],'limits':[lo,hi]}
              result={'reach':reach,'worst':worst};results.append(result)
              print('FEASIBLE_BRACE '+json.dumps(result),flush=True)
          output=root/'out/brace';output.mkdir(parents=True,exist_ok=True)
          (output/'results.json').write_text(json.dumps(results,indent=2)+'\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: feeding-brace-envelope
          path: out/brace
          retention-days: 14
