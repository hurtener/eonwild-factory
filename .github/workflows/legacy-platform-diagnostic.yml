name: Canonical full integration verification
on:
  push:
    branches: [diag/v9-legacy-reproduction-20260907]
permissions:
  contents: read
jobs:
  full-suite:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -e . pytest==9.1.1
      - run: bash tools/ci_setup_blender.sh
      - run: bash tools/ci_setup_gltf_validator.sh
      - name: Full suite with genuine Blender and Khronos validator
        run: |
          set -euo pipefail
          git config user.name 'Eonwild regression runner'
          git config user.email 'eonwild-regression@example.invalid'
          mkdir -p out/ci
          python -m pytest tests -q --tb=short --junitxml=out/ci/full-tests.xml 2>&1 | tee out/ci/full-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: canonical-full-integration-results
          path: out/ci
          retention-days: 14
