name: Separate pad recovery from metatarsal push-off
on:
  push:
    branches: [diag/v9-legacy-reproduction-20260907]
permissions:
  contents: read
jobs:
  pad-recovery:
    permissions: {contents: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env: {PYTHONPATH: src, OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '2', GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -e . pytest==9.1.1
      - run: python tools/migrations/stage_pad_recovery.py
      - run: python -m pytest tests/test_pad_recovery.py tests/test_centered_grounded_placement.py tests/test_articulated_contact_partition.py tests/test_motion_performance.py tests/test_motion_contact_adversarial.py -q --tb=short
      - name: Measure actual run after independent pad recovery
        run: python tools/diagnose_limb_envelope.py --recipe recipes/heavy-biped/run.v4.json --output out/pad-recovery-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pad-recovery-run
          path: |
            out/pad-recovery-run
            src/eonwild_motion/solve/airborne_gait.py
            src/eonwild_motion/solve/performance.py
          retention-days: 14
