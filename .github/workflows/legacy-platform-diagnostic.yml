name: Resolve exact remaining locomotion and feeding witnesses
on:
  push:
    branches: [diag/v9-legacy-reproduction-20260907]
permissions:
  contents: read
jobs:
  limb-envelope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: {recipe: [run.v3, sprint.v3]}
    env: {PYTHONPATH: src, OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '2', RECIPE: '${{ matrix.recipe }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -e .
      - run: python tools/diagnose_limb_envelope.py --recipe "recipes/heavy-biped/$RECIPE.json" --output "out/envelope/$RECIPE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: limb-envelope-${{ matrix.recipe }}
          path: out/envelope
          retention-days: 14
  feeding-candidate:
    permissions: {contents: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: {PYTHONPATH: src, OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '2', GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -e .
      - name: Stage measured feeding brace and check final emitted support/grip
        shell: python
        run: |
          import json,pathlib,hashlib,subprocess,sys
          from eonwild_motion.factory.compiler import compile_recipe,verify_package
          from eonwild_motion.factory.io import digest,json_bytes
          root=pathlib.Path.cwd()
          profile=json.loads((root/'catalog/programs/heavy-biped.feeding.v1.json').read_text())
          profile['support_reach_body_heights']=[-.08,.18]
          profile['reference_basis']='V9 Feeding003 performance; support brace admitted inside unchanged limb limits after measured posture sweep'
          target=root/'catalog/programs/heavy-biped.feeding.v2.json'
          target.write_text(json.dumps(profile,indent=2,sort_keys=True)+'\n')
          recipe=json.loads((root/'recipes/heavy-biped/feeding.v1.json').read_text())
          recipe.update(id='heavy-biped.feeding.v2',version=2,supersedes='heavy-biped.feeding.v1',description='Supported grip/pull/release with feasible body-normalized bracing; final skin and oral constraints mandatory')
          recipe['program_profile']={'path':str(target.relative_to(root)),'sha256':digest(target.read_bytes())}
          recipe_path=root/'recipes/heavy-biped/feeding.v2.json'
          recipe_path.write_text(json.dumps(recipe,indent=2,sort_keys=True)+'\n')
          for path in (target,recipe_path):
              response=subprocess.run(['gh','api','repos/hurtener/eonwild-factory/git/blobs','--method','POST','--input','-'],
                  input=json.dumps({'content':path.read_text(),'encoding':'utf-8'}),text=True,capture_output=True,check=True)
              print('FEEDING_VERSIONED_INPUT '+json.dumps({'path':str(path.relative_to(root)),'blob':json.loads(response.stdout)['sha'],'sha256':digest(path.read_bytes())}),flush=True)
          output=root/'out/feeding.v2'
          compile_recipe(recipe_path,root=root,output=output)
          result=verify_package(output);validation=json.loads((output/'validation.json').read_text())
          print('FEEDING_V2_ACCEPTANCE '+json.dumps(result),flush=True)
          print('FEEDING_V2_VALIDATION '+json.dumps(validation),flush=True)
          if result['technical_status']!='PASS':sys.exit(2)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: feeding-v2-candidate
          path: |
            out/feeding.v2
            catalog/programs/heavy-biped.feeding.v2.json
            recipes/heavy-biped/feeding.v2.json
          retention-days: 14
