name: chatgpt-export-babylon-v9-assets

on:
  push:
    branches:
      - chatgpt/babylon-v9-asset-export
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage approved integration inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/creature export/metadata

          cp 'procedural-animation-toolkit(v5.5)/validated_result/v5.5/tarbosaurus_procedural_v5_5_animation_pack.glb' export/creature/tarbosaurus-v5_5-fallback-pack.glb
          cp 'procedural-animation-toolkit(v5.5)/validated_result/v5.5/animation-manifest.v5.5.json' export/metadata/v5_5-animation-manifest.json
          cp 'procedural-animation-toolkit(v5.5)/validated_result/v5.5/v5.5-release-validation.json' export/metadata/v5_5-release-validation.json

          cp 'build/V9-NEUTRAL-IDLE-SEAM-CONDITIONING-002/diagnostic/neutral-idle-conditioned-candidate.glb' export/creature/v9-neutral-idle.glb
          cp 'build/V9-NARROW-GAUGE-WALK-002/sweep-run-016-v4-skinned-authority/sweep-0p34000000000000002-fa4aa9445c12/narrow-gauge-walk-root_motion.glb' export/creature/v9-narrow-walk-root-motion.glb
          cp 'build/V9-NARROW-GAUGE-WALK-002/sweep-run-016-v4-skinned-authority/sweep-0p34000000000000002-fa4aa9445c12/candidate-contact-profile-root_motion.json' export/metadata/v9-walk-contact-profile.json
          cp 'build/V9-AIRBORNE-RUN-001/iteration-008-open-support/trial-05/airborne-run-in_place.glb' export/creature/v9-run-in-place.glb
          cp 'build/V9-AIRBORNE-RUN-001/iteration-008-open-support/trial-05/review-summary.json' export/metadata/v9-run-review-summary.json
          cp 'build/V9-AIRBORNE-RUN-001/iteration-008-open-support/trial-05/engineering-profile.json' export/metadata/v9-run-engineering-profile.json
          cp 'build/V9-AIRBORNE-SPRINT-001/review-candidate-004/trial-06/airborne-run-in_place.glb' export/creature/v9-sprint-in-place.glb
          cp 'build/V9-AIRBORNE-SPRINT-001/review-candidate-004/trial-06/review-summary.json' export/metadata/v9-sprint-review-summary.json
          cp 'build/V9-AIRBORNE-SPRINT-001/review-candidate-004/trial-06/engineering-profile.json' export/metadata/v9-sprint-engineering-profile.json
          cp 'build/V9-FEEDING-REVIEW-003/feeding.glb' export/creature/v9-feeding.glb
          cp 'build/V9-FEEDING-REVIEW-003/profile.json' export/metadata/v9-feeding-profile.json
          cp 'build/V9-FEEDING-REVIEW-003/prop-coupling-receipt.json' export/metadata/v9-feeding-prop-coupling-receipt.json
          cp 'profiles/v9/tarbosaurus-provisional.json' export/metadata/v9-tarbosaurus-profile.json

          find export -type f -print0 | sort -z | xargs -0 sha256sum > export/sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: eonwild-babylon-v9-animation-assets
          path: export
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
