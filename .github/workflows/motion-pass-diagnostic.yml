name: Sprint release and transition surface diagnosis
on:
  push:
    branches: [diag/sprint-release-20260907]
permissions: {contents: read, actions: read}
jobs:
  prior-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - name: Inspect exact failed start packages without recompiling or changing evidence
        shell: python
        run: |
          import subprocess,json,hashlib,io,zipfile
          inputs=[('walk-start',10006339681,'ef87b131d7292bf8ffd00a4b12c7b9219636e2145f9c3b218f825172b5caf2fa'),('run-start',10006217320,'b040c69bdf7cb6076280a3d8533198750954fbdce2245af70a4a6c0db2f1e378')]
          def bad(v,path=''):
              rows=[]
              if isinstance(v,dict):
                  if v.get('status') in ('FAIL','ERROR') or v.get('verdict')=='FAIL' or any(x is False for x in v.get('checks',{}).values()):
                      rows.append({'path':path,**{k:x for k,x in v.items() if k in ('reason','reasons','checks','limits','values','maximum_degrees_per_s','peak_witness','maximum_penetration_m','maximum_surface_gap_m')}})
                  for k,x in v.items():
                      if isinstance(x,dict): rows+=bad(x,path+'.'+k)
              return rows
          for name,ident,expected in inputs:
              raw=subprocess.run(['gh','api',f'/repos/hurtener/eonwild-factory/actions/artifacts/{ident}/zip'],check=True,capture_output=True).stdout
              assert hashlib.sha256(raw).hexdigest()==expected
              z=zipfile.ZipFile(io.BytesIO(raw))
              def read(suffix):
                  matches=[n for n in z.namelist() if n.endswith(suffix)]
                  assert len(matches)==1,matches
                  return json.loads(z.read(matches[0]))
              v=read('candidate/validation.json');s=read('candidate/solver-receipt.json')
              print('START_SURFACE',name,json.dumps({'failures':bad(v),'refinement':s.get('skin_target_refinement'),'surface':v.get('skinned_contact'),'inplace':v.get('in_place_skinned_contact')}),flush=True)
  motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: {case: [early-lift-22, early-lift-24, earliest-lift-22]}
    env: {PYTHONPATH: src, OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '2', CASE: '${{ matrix.case }}', GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -e . pytest==9.1.1 -q
      - name: Restore tested source proposal and coordinate early release
        shell: python
        run: |
          from pathlib import Path
          import json,hashlib,os,subprocess,io,zipfile
          raw=subprocess.run(['gh','api','/repos/hurtener/eonwild-factory/actions/artifacts/10006260714/zip'],check=True,capture_output=True).stdout
          assert hashlib.sha256(raw).hexdigest()=='2c913e9838f52022f261f9a84f41ab04df144b0e9e7e51276eaced072e24ca60'
          z=zipfile.ZipFile(io.BytesIO(raw)); names=[n for n in z.namelist() if n.endswith('source-proposal/files.json')];assert len(names)==1
          files=json.loads(z.read(names[0]));allowed={'src/eonwild_motion/planning/airborne_gait.py','src/eonwild_motion/planning/gait_transition.py','catalog/programs/heavy-biped.sprint.v4.json','recipes/heavy-biped/sprint.v4.json'}
          assert set(files)==allowed
          for path,text in files.items(): Path(path).write_text(text)
          p=Path('catalog/programs/heavy-biped.sprint.v4.json'); g=json.loads(p.read_text());params=g['parameters']
          params.update(swing_transport_ramp_fraction=.10,swing_lift_fraction=.12,swing_clearance_body_heights=.16)
          if os.environ['CASE']=='early-lift-24':params['pelvis_crouch_body_heights']=.24
          if os.environ['CASE']=='earliest-lift-22':params.update(swing_lift_fraction=.10,swing_transport_ramp_fraction=.12)
          original=json.loads(Path('catalog/programs/heavy-biped.sprint.v3.json').read_text())['parameters']
          for key in ('step_length_body_heights','step_period_s','flight_fraction','max_joint_angular_velocity_degrees_per_s','max_ankle_pitch_velocity_degrees_per_s','hip_extension_limit_degrees','hip_flexion_limit_degrees','knee_min_interior_degrees','knee_max_interior_degrees','ankle_min_interior_degrees','ankle_max_interior_degrees'):
              assert params[key]==original[key],key
          p.write_text(json.dumps(g,indent=2,sort_keys=True)+'\n');r=Path('recipes/heavy-biped/sprint.v4.json');recipe=json.loads(r.read_text());recipe['program_profile']['sha256']=hashlib.sha256(p.read_bytes()).hexdigest();r.write_text(json.dumps(recipe,indent=2,sort_keys=True)+'\n')
          out=Path('out/source-proposal');out.mkdir(parents=True)
          (out/'files.json').write_text(json.dumps({p:Path(p).read_text() for p in allowed},indent=2)+'\n')
          print('SPRINT_INPUTS',json.dumps(params),flush=True)
      - run: python -m pytest tests/test_swing_transport.py tests/test_behavior_programs.py -q --tb=short
      - name: Require unchanged acceptance on the final serialized motion
        shell: bash
        run: |
          set +e
          python tools/inspect_motion_failure.py --recipe recipes/heavy-biped/sprint.v4.json --output out/diagnostic > out/diagnostic.log 2>&1
          result=$?
          python tools/summarize_motion_diagnostic.py out/diagnostic/diagnostic.json --output out/summary.json
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'release-${{ matrix.case }}', path: out, if-no-files-found: error, retention-days: 14}
