name: Sprint transport coordination diagnosis
on:
  push:
    branches: [diag/sprint-transport-20260907]
permissions: {contents: read}
jobs:
  motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {case: [transport-20, transport-22, broad-ramp-20, posture-control]}
    env: {PYTHONPATH: src, OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '2', CASE: '${{ matrix.case }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -e . pytest==9.1.1 -q
      - name: Prepare exact source edits and immutable proposed inputs
        shell: python
        run: |
          from pathlib import Path
          import json,hashlib,os
          def patch(path,old,new):
              p=Path(path); text=p.read_text(); assert text.count(old)==1,(path,old)
              p.write_text(text.replace(old,new))
          path='src/eonwild_motion/planning/airborne_gait.py'
          patch(path,'from ..errors import ContractError','from ..errors import ContractError\nfrom .swing_transport import transport_progress, validate_transport_ramp')
          patch(path,'    rounded_swing_peak_fraction: float = 0.0','    rounded_swing_peak_fraction: float = 0.0\n    swing_transport_ramp_fraction: float = 0.0')
          patch(path,'        if self.continuous_body_launch_fraction:\n            trough, rise', '        validate_transport_ramp(self.swing_transport_ramp_fraction)\n        if self.continuous_body_launch_fraction:\n            trough, rise')
          patch(path,'            x = anchor + 2 * travel * _smooth(swing_phase)','            progress = (transport_progress(swing_phase, gait.swing_transport_ramp_fraction)\n                        if gait.swing_transport_ramp_fraction else _smooth(swing_phase))\n            x = anchor + 2 * travel * progress')
          path='src/eonwild_motion/planning/gait_transition.py'
          patch(path,'from ..errors import ContractError','from ..errors import ContractError\nfrom .swing_transport import transport_progress')
          patch(path,'            forward = self.touchdown(touchdown) + (self.touchdown(next_touchdown) - self.touchdown(touchdown)) * smooth(swing)','            progress = (transport_progress(swing, self.gait.swing_transport_ramp_fraction)\n                        if not self.grounded and self.gait.swing_transport_ramp_fraction else smooth(swing))\n            forward = self.touchdown(touchdown) + (self.touchdown(next_touchdown) - self.touchdown(touchdown)) * progress')
          r=json.loads(Path('recipes/heavy-biped/sprint.v3.json').read_text())
          g=json.loads(Path(r['program_profile']['path']).read_text())
          params=g['parameters']; original=dict(params)
          params.update(touchdown_reach_body_heights=.60,pelvis_crouch_body_heights=.20,
                        swing_clearance_body_heights=.18,swing_lift_fraction=.18,swing_lower_fraction=.32,
                        swing_approach_lift_body_heights=.06,swing_transport_ramp_fraction=.18)
          if os.environ['CASE']=='transport-22': params['pelvis_crouch_body_heights']=.22
          elif os.environ['CASE']=='broad-ramp-20': params['swing_transport_ramp_fraction']=.24
          elif os.environ['CASE']=='posture-control': params.update(swing_transport_ramp_fraction=0.,pelvis_crouch_body_heights=.22)
          for key in ('step_length_body_heights','step_period_s','flight_fraction','max_joint_angular_velocity_degrees_per_s','max_ankle_pitch_velocity_degrees_per_s','hip_extension_limit_degrees','hip_flexion_limit_degrees','knee_min_interior_degrees','knee_max_interior_degrees','ankle_min_interior_degrees','ankle_max_interior_degrees'):
              assert params[key]==original[key],key
          p=Path('catalog/programs/heavy-biped.sprint.v4.json')
          p.write_text(json.dumps(g,indent=2,sort_keys=True)+'\n')
          r.update(id='heavy-biped.sprint.v4',version=4,supersedes='heavy-biped.sprint.v3')
          r['description']='Full-stride sprint with velocity-ramped swing transport and coordinated loading; pending independent visual review'
          r['program_profile']={'path':str(p),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          Path('recipes/heavy-biped/sprint.v4.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          out=Path('out/source-proposal');out.mkdir(parents=True)
          paths=[Path('src/eonwild_motion/planning/airborne_gait.py'),Path('src/eonwild_motion/planning/gait_transition.py'),p,Path('recipes/heavy-biped/sprint.v4.json')]
          proposal={str(p):p.read_text() for p in paths}
          (out/'files.json').write_text(json.dumps(proposal,indent=2)+'\n')
          print('SPRINT_INPUTS',json.dumps(params),flush=True)
      - name: New transport and existing choreography regression tests
        run: python -m pytest tests/test_swing_transport.py tests/test_behavior_programs.py -q --tb=short
      - name: Measure actual sprint without relaxing acceptance
        run: python tools/inspect_motion_failure.py --recipe recipes/heavy-biped/sprint.v4.json --output out/diagnostic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: transport-${{ matrix.case }}
          path: out
          if-no-files-found: error
          retention-days: 14
