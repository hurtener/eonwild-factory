name: Actual emitted handoff diagnosis
on:
  push:
    branches: [diag/motion-joins-20260907]
permissions: {contents: read, actions: read}
jobs:
  handoffs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: {PYTHONPATH: src, OPENBLAS_NUM_THREADS: '1', GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -e . pytest==9.1.1 -q
      - run: python -m pytest tests/test_emitted_handoff.py -q --tb=short
      - name: Reopen exactly identified packages and preserve failing joins
        shell: python
        run: |
          import pathlib,subprocess,json,zipfile,io,hashlib
          from eonwild_motion.factory.handoff import verify_handoff
          root=pathlib.Path('.').resolve();out=root/'out/joins';out.mkdir(parents=True)
          specs={
          'walk':(10002238937,'d96f50aa5a64f35ef6f9acc9a58b9fecad3f013ec0e4db9b910ebb16032f10c5'),
          'run':(10002177178,'c7ac7a4af1713d030653b91d44c062449a9007b8db0a9791a2ad9e2fd13dbb84'),
          'reverse-walk':(10002189300,'a458e1c335bd7e28fadd434217b044ee28069266784c7a11b2401819e184a76e'),
          'walk-stop':(10006276362,'af6a989295ff8354ff7ef83a2ea4e094b370376c19744cf37d25968e3c76de12'),
          'run-stop':(10006248380,'e0b250cbed9efcf72d1dfbd9beac754fb42b151775976c297cf447faa45397a8'),
          'reverse-walk-stop':(10006523906,'772707681059d90f444b88433a19c0bc5619f5d002f8db7e9ca07cee5ebd0c75'),
          'walk-start':(10006339681,'ef87b131d7292bf8ffd00a4b12c7b9219636e2145f9c3b218f825172b5caf2fa'),
          'run-start':(10006217320,'b040c69bdf7cb6076280a3d8533198750954fbdce2245af70a4a6c0db2f1e378'),
          'reverse-walk-start':(10006561197,'4d69ff3f517e7c246206f24e7c7ca35ca9abf9075cc46a6cdbbdb2f58802ca1e')}
          packages={};failures=[]
          for name,(ident,sha) in specs.items():
              process=subprocess.run(['gh','api',f'/repos/hurtener/eonwild-factory/actions/artifacts/{ident}/zip'],capture_output=True,check=True)
              raw=process.stdout;assert hashlib.sha256(raw).hexdigest()==sha
              z=zipfile.ZipFile(io.BytesIO(raw));manifests=[n for n in z.namelist() if n=='manifest.json' or n.endswith('/manifest.json')];assert len(manifests)==1,manifests
              prefix=manifests[0][:-len('manifest.json')];package=out/name;package.mkdir()
              for n in z.namelist():
                  suffix=n[len(prefix):]
                  if n.startswith(prefix) and suffix not in ('','.','..') and '/' not in suffix and '\\' not in suffix and not n.endswith('/'):(package/suffix).write_bytes(z.read(n))
              packages[name]=package
          for gait in ('walk','run','reverse-walk'):
              for kind in ('start','stop'):
                  name=gait+'-'+kind
                  try:result=verify_handoff(packages[name],packages[gait],root=root)
                  except Exception as exc:result={'status':'ERROR','error':str(exc)}
                  (out/f'{name}.json').write_text(json.dumps(result,indent=2)+'\n')
                  summary={k:v for k,v in result.items() if k!='modes'}
                  summary['modes']={k:{x:y for x,y in v.items() if x!='motion_owned_nodes'} for k,v in result.get('modes',{}).items()}
                  print('ACTUAL_HANDOFF',name,json.dumps(summary),flush=True)
                  print('RECIPE',name,(packages[name]/'recipe.json').read_text(),flush=True)
                  failures.append(result['status']!='PASS')
          if any(failures):raise SystemExit('At least one real handoff remains blocked')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: actual-handoffs, path: 'out/joins/*.json', if-no-files-found: error, retention-days: 14}
