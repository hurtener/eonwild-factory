name: Focused sprint and handoff diagnosis
on:
  push:
    branches: [diag/motion-handoffs-20260907]
permissions: {contents: read}
concurrency:
  group: focused-${{ github.ref }}
  cancel-in-progress: true
jobs:
  motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        recipe: [sprint.v3, sprint-centered.v1, walk-start.v2, walk-stop.v2, run-start.v2, run-stop.v2, reverse-walk-start.v2, reverse-walk-stop.v2, fast-walk.v2]
    env: {PYTHONPATH: src, OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '2', RECIPE: '${{ matrix.recipe }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -e . -q
      - name: Bind proposed transitions to existing mechanically accepted profiles
        shell: python
        run: |
          import pathlib, json, hashlib, os
          root=pathlib.Path('.'); name=os.environ['RECIPE']
          def write(path, value):
              raw=(json.dumps(value,indent=2,sort_keys=True)+'\n').encode()
              path.write_bytes(raw)
              print('PROPOSED_INPUT', str(path), hashlib.sha256(raw).hexdigest(), raw.decode(), flush=True)
              return {'path':str(path),'sha256':hashlib.sha256(raw).hexdigest()}
          if name=='sprint-centered.v1':
              r=json.loads((root/'recipes/heavy-biped/sprint.v3.json').read_text())
              g=json.loads((root/r['program_profile']['path']).read_text())
              g['parameters']['touchdown_reach_body_heights']=0.65
              r['program_profile']=write(root/'catalog/programs/heavy-biped.sprint-centered.v1.json',g)
              r['id']='heavy-biped.'+name; r['version']=1
              write(root/f'recipes/heavy-biped/{name}.json',r)
          elif name.endswith(('start.v2','stop.v2')):
              r=json.loads((root/f'recipes/heavy-biped/{name[:-1]}1.json').read_text())
              family=name.rsplit('-',1)[0]
              accepted={'walk':'walk.v3','reverse-walk':'reverse-walk.v4','run':'run.v4'}[family]
              steady=json.loads((root/f'recipes/heavy-biped/{accepted}.json').read_text())
              r['gait_profile']=steady['program_profile'];r['performance_profile']=steady['performance_profile']
              r['supersedes']=r['id'];r['id']='heavy-biped.'+name;r['version']=2
              write(root/f'recipes/heavy-biped/{name}.json',r)
      - name: Compile with unchanged gates and retain native failure witnesses
        run: python tools/inspect_motion_failure.py --recipe "recipes/heavy-biped/$RECIPE.json" --output out/diagnostic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: focus-${{ matrix.recipe }}
          path: out/diagnostic
          if-no-files-found: error
          retention-days: 14
