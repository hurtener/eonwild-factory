name: Sprint transport and emitted handoff verification
on:
  push:
    branches: [diag/motion-joins-20260907]
permissions: {contents: read, actions: read}
jobs:
  handoffs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env: {PYTHONPATH: src, OPENBLAS_NUM_THREADS: '1', GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -e . pytest==9.1.1 -q
      - run: python -m pytest tests/test_emitted_handoff.py -q --tb=short
      - name: Evaluate immutable emitted packages at the real join
        shell: python
        run: |
          import pathlib,subprocess,json,zipfile,io,hashlib
          from eonwild_motion.factory.handoff import verify_handoff
          root=pathlib.Path('.').resolve();out=root/'out/joins';out.mkdir(parents=True)
          specs={
          'walk':(10002238937,'d96f50aa5a64f35ef6f9acc9a58b9fecad3f013ec0e4db9b910ebb16032f10c5'),
          'run':(10002177178,'c7ac7a4af1713d030653b91d44c062449a9007b8db0a9791a2ad9e2fd13dbb84'),
          'reverse-walk':(10002189300,'a458e1c335bd7e28fadd434217b044ee28069266784c7a11b2401819e184a76e'),
          'walk-stop':(10006155727,'0f62d4c1a6d86c2ca37e93d718cfbf2dd06af93fe5f6b033c85160769b221157'),
          'run-stop':(10006131522,'46ad073a3e1934fb857915c9605b833ab152d603e22cd67b4a8f967f88c45b4a'),
          'reverse-walk-stop':(10006356580,'a0e4bcec6cd5f217bf590660c6228ac61dac8f1711e695ce3e343fb2a90a020fe'),
          'walk-start':(10006339681,'ef87b131d7292bf8ffd00a4b12c7b9219636e2145f9c3b218f825172b5caf2fa'),
          'run-start':(10006217320,'b040c69bdf7cb6076280a3d8533198750954fbdce2245af70a4a6c0db2f1e378'),
          'reverse-walk-start':(10006383692,'df6c4b041ff807de218d0c21f14607bc819a27912b1f048f0c61f0fe6f9f7e678')}
          packages={}
          for name,(ident,sha) in specs.items():
              raw=subprocess.run(['gh','api',f'/repos/hurtener/eonwild-factory/actions/artifacts/{ident}/zip'],capture_output=True,check=True).stdout
              assert hashlib.sha256(raw).hexdigest()==sha
              z=zipfile.ZipFile(io.BytesIO(raw)); manifests=[n for n in z.namelist() if n.endswith('/manifest.json')];assert len(manifests)==1,manifests
              prefix=manifests[0].rsplit('/',1)[0]+'/';package=out/name;package.mkdir()
              for n in z.namelist():
                  if n.startswith(prefix) and '/' not in n[len(prefix):] and not n.endswith('/'):
                      (package/n[len(prefix):]).write_bytes(z.read(n))
              packages[name]=package
          failures=[]
          for gait in ('walk','run','reverse-walk'):
              for kind in ('start','stop'):
                  name=gait+'-'+kind
                  try: result=verify_handoff(packages[name],packages[gait],root=root)
                  except Exception as exc: result={'status':'ERROR','error':str(exc)}
                  (out/f'{name}.json').write_text(json.dumps(result,indent=2)+'\n')
                  summary={k:v for k,v in result.items() if k!='modes'}
                  summary['modes']={k:{x:y for x,y in v.items() if x!='motion_owned_nodes'} for k,v in result.get('modes',{}).items()}
                  print('ACTUAL_HANDOFF',name,json.dumps(summary),flush=True)
                  plan=json.loads((packages[name]/'plan.json').read_text()); rows=plan['samples']
                  if kind=='start':print('START_INITIAL_CONTACTS',name,json.dumps([{k:r[k] for k in ('time_s','feet','support_count')} for r in rows[:4]]),flush=True)
                  failures.append(result['status']!='PASS')
          if any(failures):raise SystemExit('At least one real handoff remains blocked')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: actual-handoffs, path: 'out/joins/*.json', if-no-files-found: error, retention-days: 14}
  sprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {case: [long-lift, balanced, low-clearance, lower-body]}
    env: {PYTHONPATH: src, OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '2', CASE: '${{ matrix.case }}', GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -e . pytest==9.1.1 -q
      - name: Coordinate clearance and transport while preserving full stride and limits
        shell: python
        run: |
          from pathlib import Path
          import json,hashlib,os,subprocess,io,zipfile
          raw=subprocess.run(['gh','api','/repos/hurtener/eonwild-factory/actions/artifacts/10006625673/zip'],check=True,capture_output=True).stdout
          assert hashlib.sha256(raw).hexdigest()=='b81d0ad3403ae8ac6439de26e7183c8c50adfd836af65b8c6d0cb86cb35714db'
          z=zipfile.ZipFile(io.BytesIO(raw));names=[n for n in z.namelist() if n.endswith('source-proposal/files.json')];assert len(names)==1
          files=json.loads(z.read(names[0]));allowed={'src/eonwild_motion/planning/airborne_gait.py','src/eonwild_motion/planning/gait_transition.py','catalog/programs/heavy-biped.sprint.v4.json','recipes/heavy-biped/sprint.v4.json'};assert set(files)==allowed
          for path,text in files.items():Path(path).write_text(text)
          p=Path('catalog/programs/heavy-biped.sprint.v4.json');g=json.loads(p.read_text());params=g['parameters']
          cases={'long-lift':(.60,.24,.16,.16,.06),'balanced':(.62,.24,.15,.14,.08),'low-clearance':(.62,.24,.14,.16,.06),'lower-body':(.62,.26,.14,.16,.06)}
          keys=('touchdown_reach_body_heights','pelvis_crouch_body_heights','swing_clearance_body_heights','swing_lift_fraction','swing_transport_ramp_fraction')
          params.update(dict(zip(keys,cases[os.environ['CASE']])))
          original=json.loads(Path('catalog/programs/heavy-biped.sprint.v3.json').read_text())['parameters']
          for key in ('step_length_body_heights','step_period_s','flight_fraction','max_joint_angular_velocity_degrees_per_s','max_ankle_pitch_velocity_degrees_per_s','hip_extension_limit_degrees','hip_flexion_limit_degrees','knee_min_interior_degrees','knee_max_interior_degrees','ankle_min_interior_degrees','ankle_max_interior_degrees'):assert params[key]==original[key],key
          p.write_text(json.dumps(g,indent=2,sort_keys=True)+'\n');r=Path('recipes/heavy-biped/sprint.v4.json');recipe=json.loads(r.read_text());recipe['program_profile']['sha256']=hashlib.sha256(p.read_bytes()).hexdigest();r.write_text(json.dumps(recipe,indent=2,sort_keys=True)+'\n')
          out=Path('out/source-proposal');out.mkdir(parents=True)
          (out/'files.json').write_text(json.dumps({p:Path(p).read_text() for p in allowed},indent=2)+'\n')
      - run: python -m pytest tests/test_swing_transport.py tests/test_behavior_programs.py -q --tb=short
      - name: Require unchanged mechanical gates
        shell: bash
        run: |
          set +e
          python tools/inspect_motion_failure.py --recipe recipes/heavy-biped/sprint.v4.json --output out/diagnostic > out/diagnostic.log 2>&1
          result=$?
          python tools/summarize_motion_diagnostic.py out/diagnostic/diagnostic.json --output out/summary.json
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'coordinated-${{ matrix.case }}', path: out, if-no-files-found: error, retention-days: 14}
