name: V9 one-time baseline migration
on:
  push:
    branches: [feat/v9-factory-baseline]
    paths: [tools/migrations/apply_v9_baseline.py, .github/workflows/factory-bootstrap.yml]
permissions:
  contents: read
jobs:
  migrate:
    if: github.ref == 'refs/heads/feat/v9-factory-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v9-factory-baseline
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest==9.1.1
      - name: Apply controlled source and catalog migration
        run: python tools/migrations/apply_v9_baseline.py
      - name: Verify pure Python regression suite before publishing migration
        env:
          PYTHONPATH: src
        run: python -m pytest tests -q --ignore=tests/test_integration.py -k 'not test_zero_bounds_fails_blender_stage' --junitxml=/tmp/factory-tests.xml
      - name: Commit migration on this feature branch only
        shell: bash
        run: |
          test "${GITHUB_REF}" = "refs/heads/feat/v9-factory-baseline"
          git config user.name 'eonwild factory automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add catalog recipes assets/sha256 legacy/capsules src tests
          if ! git diff --cached --quiet; then
            git commit -m 'refactor: admit V9 sources and retire redundant V8 toolkits'
            git push origin HEAD:refs/heads/feat/v9-factory-baseline
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-migration-verification
          path: /tmp/factory-tests.xml
          retention-days: 14
