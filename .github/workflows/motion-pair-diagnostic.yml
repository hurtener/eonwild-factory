name: Source-bound start stop integration
on:
  push:
    branches: [diag/motion-pair-integration-20260907]
permissions: {contents: read}
jobs:
  pairs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {gait: walk, steady: walk.v3}
          - {gait: reverse-walk, steady: reverse-walk.v4}
          - {gait: run, steady: run.v4}
          - {gait: sprint, steady: sprint.v4}
    env: {PYTHONPATH: src, OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '2', GAIT: '${{ matrix.gait }}', STEADY: '${{ matrix.steady }}'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1, persist-credentials: false, show-progress: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: python -m pip install -e . pytest==9.1.1 -q
      - name: Binding, malformed evidence and native derivative regressions
        run: python -m pytest tests/test_emitted_handoff.py tests/test_handoff_catalog_bindings.py tests/test_sprint_and_fast_walk_catalog.py tests/test_swing_transport.py -q --tb=short
      - name: Independently compile all three real clips and inspect both serialized joins
        run: python tools/verify_transition_pair.py --steady "recipes/heavy-biped/$STEADY.json" --start "recipes/heavy-biped/$GAIT-start.v2.json" --stop "recipes/heavy-biped/$GAIT-stop.v2.json" --output out/pair
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'pair-${{ matrix.gait }}', path: out/pair, if-no-files-found: error, retention-days: 14}
