name: chatgpt-rig-diagnostic

on:
  push:
    branches:
      - chatgpt/babylon-rig-diagnostic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report unmatched animation target nodes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import struct
          from pathlib import Path

          paths = {
              "v5.5": Path("procedural-animation-toolkit(v5.5)/validated_result/v5.5/tarbosaurus_procedural_v5_5_animation_pack.glb"),
              "run": Path("build/V9-AIRBORNE-RUN-001/iteration-008-open-support/trial-05/airborne-run-in_place.glb"),
              "sprint": Path("build/V9-AIRBORNE-SPRINT-001/review-candidate-004/trial-06/airborne-run-in_place.glb"),
          }

          def read(path):
              data = path.read_bytes()
              offset = 12
              while offset + 8 <= len(data):
                  length, kind = struct.unpack_from("<II", data, offset)
                  offset += 8
                  payload = data[offset:offset + length]
                  offset += length
                  if kind == 0x4E4F534A:
                      return json.loads(payload.decode("utf-8").rstrip(" \t\r\n\0"))
              raise RuntimeError(path)

          def norm(name):
              name = re.sub(r"\.\d{3}$", "", name)
              return re.sub(r"[^A-Za-z0-9]+", "", name).lower()

          def parents(doc):
              result = {}
              for parent, node in enumerate(doc.get("nodes", [])):
                  for child in node.get("children", []):
                      result[child] = parent
              return result

          docs = {key: read(path) for key, path in paths.items()}
          base = docs["v5.5"]
          base_nodes = base.get("nodes", [])
          base_exact = {node.get("name", ""): index for index, node in enumerate(base_nodes) if node.get("name")}
          base_normalized = {norm(name): (name, index) for name, index in base_exact.items()}

          report = {"baseNodeCount": len(base_nodes), "sources": {}}
          for key in ("run", "sprint"):
              doc = docs[key]
              nodes = doc.get("nodes", [])
              parent = parents(doc)
              target_indices = sorted({
                  channel["target"]["node"]
                  for animation in doc.get("animations", [])
                  for channel in animation.get("channels", [])
                  if "node" in channel.get("target", {})
              })
              unmatched = []
              for index in target_indices:
                  name = nodes[index].get("name", "")
                  if name in base_exact or norm(name) in base_normalized:
                      continue
                  parent_index = parent.get(index)
                  unmatched.append({
                      "index": index,
                      "name": name,
                      "normalized": norm(name),
                      "parentIndex": parent_index,
                      "parentName": nodes[parent_index].get("name", "") if parent_index is not None else None,
                      "mesh": nodes[index].get("mesh"),
                      "skin": nodes[index].get("skin"),
                  })
              report["sources"][key] = {
                  "nodeCount": len(nodes),
                  "targetNodeCount": len(target_indices),
                  "unmatched": unmatched,
                  "rootNodes": [
                      {"index": index, "name": node.get("name", ""), "mesh": node.get("mesh"), "skin": node.get("skin")}
                      for index, node in enumerate(nodes)
                      if index not in parent
                  ],
              }

          print("RETARGET_DIAGNOSTIC=" + json.dumps(report, separators=(",", ":")))
          Path("retarget-diagnostic.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eonwild-retarget-diagnostic
          path: retarget-diagnostic.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
