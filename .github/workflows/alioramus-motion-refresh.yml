name: Alioramus motion refresh

on:
  push:
    branches: [codex/alioramus-motion-refresh]
    paths:
      - '.github/workflows/alioramus-motion-refresh.yml'
      - 'src/eonwild_motion/biomechanics/**'
      - 'tools/build_alioramus_refresh.py'
      - 'tools/requirements-biomechanics-review.txt'
      - 'tests/test_alioramus_refresh.py'
      - 'catalog/biomechanics/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kinematic-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated research dependencies
        run: python -m pip install -r tools/requirements-biomechanics-review.txt
      - name: Actual-rig and genuine OpenSim replay tests
        run: python -m pytest tests/test_alioramus_refresh.py -q --tb=short --junitxml=out/tests.xml
      - name: Build new candidate and test Moco environment independently
        run: python tools/build_alioramus_refresh.py --output out/alioramus-refresh --sample-hz 60 --moco-smoke
      - name: Verify that original source remains unchanged
        run: |
          test "$(git hash-object assets/animals/Models/Alioramus-altai.glb)" = 58bb677040ef9d28ce06494c5adf23ab3a80c21d
          git diff --exit-code -- assets catalog/baselines legacy/capsules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alioramus-motion-refresh-${{ github.sha }}
          path: out/
          retention-days: 14
          if-no-files-found: error
