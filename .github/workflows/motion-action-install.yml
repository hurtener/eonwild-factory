name: Install supported actions and verify
on:
  push:
    branches: [feat/motion-quality-and-breadth]
    paths: [.github/workflows/motion-action-install.yml]
permissions:
  contents: read
jobs:
  install:
    if: github.ref == 'refs/heads/feat/motion-quality-and-breadth'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          show-progress: false
      - run: python tools/_integrate_actions.py
      - name: Commit materialized source and remove the installer
        id: commit
        env:
          TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os, pathlib, subprocess, base64
          for name in ['tools/_integrate_actions.py','.github/workflows/motion-action-install.yml']:
              pathlib.Path(name).unlink()
          subprocess.run(['git','config','user.name','Eonwild factory automation'],check=True)
          subprocess.run(['git','config','user.email','eonwild-factory@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','src','tools','catalog','recipes','.github/workflows'],check=True)
          subprocess.run(['git','commit','-m','feat: integrate V9 supported action family and explicit final contact witnesses'],check=True)
          token=base64.b64encode(('x-access-token:'+os.environ['TOKEN']).encode()).decode()
          subprocess.run(['git','-c','http.https://github.com/.extraheader=AUTHORIZATION: basic '+token,'push','origin','HEAD:refs/heads/feat/motion-quality-and-breadth'],check=True,capture_output=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          print('SOURCE_HEAD',sha)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('sha='+sha+'\n')
  contracts:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.install.outputs.sha }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest==9.1.1 > /tmp/install.log
      - run: python -m pytest tests -q --ignore=tests/test_integration.py -k 'not test_zero_bounds_fails_blender_stage' --junitxml=/tmp/contracts.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: motion-contracts
          path: /tmp/contracts.xml
  generate:
    needs: install
    strategy:
      fail-fast: false
      matrix:
        recipe: [walk.v2, reverse-walk.v3, run.v3, sprint.v3, feeding.v1, bite-miss.v1, idle.v1, alert.v1, call.v1]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.install.outputs.sha }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e . > /tmp/install.log
      - name: Generate actual candidate and print concise acceptance evidence
        env:
          RECIPE: ${{ matrix.recipe }}
        shell: python
        run: |
          import os,json,pathlib
          from eonwild_motion.factory.compiler import compile_recipe
          name=os.environ['RECIPE'];out=pathlib.Path('out')/name
          compile_recipe(pathlib.Path('recipes/heavy-biped')/(name+'.json'),root=pathlib.Path.cwd(),output=out)
          v=json.loads((out/'validation.json').read_text())
          print('RESULT',name,v['technical_status'])
          for key in ['rotation_rates','solver_feasibility','oral_contact']: print(key,json.dumps(v.get(key)))
          for mode,row in v['outputs'].items(): print('skeleton',mode,json.dumps(row))
          surface=v['skinned_contact'];print('skin',json.dumps({k:value for k,value in surface.items() if k!='authority'}))
          for side,foot in surface.get('authority',{}).get('per_foot',{}).items():
              print('foot',side,'verdict',foot['verdict'],'reasons',foot.get('reasons'), 'phases',json.dumps(foot.get('phases')))
          receipt=json.loads((out/'solver-receipt.json').read_text());r=receipt.get('skin_target_refinement',{})
          print('refinement',json.dumps({k:r[k] for k in ['converged','trace','maximum_offset_m'] if k in r}))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-${{ matrix.recipe }}
          path: out
          retention-days: 14
