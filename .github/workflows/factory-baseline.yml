name: Factory baseline
on:
  push:
    branches: [feat/v9-factory-baseline]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Capture reproducible source and dependency inventory
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, tarfile
          root = pathlib.Path.cwd()
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'factory-baseline'
          output.mkdir()
          entries = []
          files = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with tarfile.open(output / 'source-snapshot.tar.gz', 'w:gz') as tar:
              for name in files:
                  if not name:
                      continue
                  path = root / name
                  row = {'path': name, 'size': path.stat().st_size}
                  keep = path.suffix.lower() in {'.py','.json','.toml','.lock','.md','.txt','.yaml','.yml','.csv','.ts','.js','.html','.css','.sh'} or name in {'.gitignore','.gitattributes'}
                  keep = keep or name.startswith('assets/sha256/')
                  if keep:
                      row['sha256'] = hashlib.sha256(path.read_bytes()).hexdigest()
                      tar.add(path, arcname=name, recursive=False)
                  entries.append(row)
          (output / 'inventory.json').write_text(json.dumps({'head': subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(), 'parent': '8c1f5c2bfea481a56916ee6e0bfa74961ca0d141', 'files': entries}, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: factory-source-snapshot
          path: ${{ runner.temp }}/factory-baseline/
          retention-days: 7
