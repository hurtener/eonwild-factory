name: Factory verification
on:
  push:
    branches: [main, feat/v9-factory-baseline]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: factory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest==9.1.1
      - name: Engine and factory contracts
        env:
          PYTHONPATH: src
        run: python -m pytest tests -q --ignore=tests/test_integration.py -k 'not test_zero_bounds_fails_blender_stage' --junitxml=/tmp/contracts.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: factory-contract-results
          path: /tmp/contracts.xml
          retention-days: 14
  generate-and-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        recipe: [run.v1, run.v2, sprint.v2, reverse-walk.v1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest==9.1.1
      - name: Install real Blender CPU renderer and separate Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender ffmpeg python3-numpy python3-jsonschema
      - name: Blender rejection regression
        if: matrix.recipe == 'run.v1'
        env:
          PYTHONPATH: src
        run: |
          mkdir -p out/ci
          python -m pytest tests/test_negative.py -q -k test_zero_bounds_fails_blender_stage --junitxml=out/ci/blender-test.xml
      - name: Generate actual motion, FBX and native-time CPU preview
        env:
          PYTHONPATH: src
          RECIPE: ${{ matrix.recipe }}
        run: python tools/build_showcase.py --output out/showcase --render --recipes "$RECIPE"
      - name: Publish measured status
        if: always()
        shell: python
        run: |
          import json, pathlib, os
          path = pathlib.Path('out/showcase/showcase.json')
          if path.exists():
              data = json.loads(path.read_text())
              summary = '\n'.join(f"{r['recipe']}: generation={r['generation']}; render={r.get('render','not run')}; acceptance={r.get('integrity',{}).get('technical_status','not measured')}" for r in data['results'])
              print(summary)
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('## Motion candidates\n\n' + summary + '\n\nGeneration/rendering success is not mechanical or visual approval. Unity parity is not run.\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: preview-${{ matrix.recipe }}
          path: |
            out/showcase/previews/*/preview.mp4
            out/showcase/previews/*/cover.png
            out/showcase/previews/*/render-receipt.json
            out/showcase/showcase.json
            out/showcase/*.log
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: motion-${{ matrix.recipe }}
          path: |
            out/showcase/*/*.glb
            out/showcase/*/*.json
            out/showcase/previews/*/motion.fbx
            out/ci/blender-test.xml
          retention-days: 14
