name: Factory verification
on:
  push:
    branches: [main, feat/v9-factory-baseline]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: factory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest==9.1.1
      - name: Engine and factory contracts (Blender-dependent tests are a separate job)
        env:
          PYTHONPATH: src
        run: python -m pytest tests -q --ignore=tests/test_integration.py -k 'not test_zero_bounds_fails_blender_stage' --junitxml=/tmp/contracts.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: factory-contract-results
          path: /tmp/contracts.xml
          retention-days: 14
  generate-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest==9.1.1
      - name: Install real Blender and video tools
        run: sudo apt-get update -qq && sudo apt-get install -y blender ffmpeg xvfb
      - name: Blender rejection regression
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_negative.py -q -k test_zero_bounds_fails_blender_stage --junitxml=/tmp/blender-test.xml
      - name: Generate actual motion and native-time previews
        env:
          PYTHONPATH: src
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: python tools/build_showcase.py --output out/showcase --render
      - name: Publish concise measured summary
        if: always()
        shell: python
        run: |
          import json, pathlib, os
          path = pathlib.Path('out/showcase/showcase.json')
          if path.exists():
              data = json.loads(path.read_text())
              summary = '\n'.join(f"{r['recipe']}: generation={r['generation']}; render={r.get('render','not run')}; acceptance={r.get('integrity',{}).get('technical_status','not measured')}" for r in data['results'])
              print(summary)
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('## Motion candidates\n\n' + summary + '\n\nCandidate generation is not visual approval or Unity validation.\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: motion-review-previews
          path: |
            out/showcase/previews/*/preview.mp4
            out/showcase/previews/*/cover.png
            out/showcase/previews/*/render-receipt.json
            out/showcase/showcase.json
            out/showcase/*.log
            /tmp/blender-test.xml
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: motion-candidate-packages
          path: |
            out/showcase/*/*.glb
            out/showcase/*/*.json
            out/showcase/previews/*/motion.fbx
          retention-days: 14
