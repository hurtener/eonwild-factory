name: Factory verification
on:
  push:
    branches: [main, feat/v9-factory-baseline]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest==9.1.1
      - run: bash tools/ci_setup_blender.sh
      - name: Full regression suite including historical integration
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/ci
          git config user.name 'Eonwild regression runner'
          git config user.email 'eonwild-regression@example.invalid'
          blender --version > out/ci/blender-version.txt
          python -m pip freeze > out/ci/python-packages.txt
          cp "$RUNNER_TEMP/blender-download/selected.sha256" out/ci/blender-archive.sha256
          git rev-parse HEAD > out/ci/tested-source.txt
          python -m pytest tests -q --tb=short --junitxml=out/ci/full-tests.xml 2>&1 | tee out/ci/full-tests.log
      - name: Diagnose locked-byte reproduction on failure in both Python environments
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        shell: python
        run: |
          import pathlib, subprocess, sys
          root = pathlib.Path('out/ci/reproduction')
          root.mkdir(parents=True, exist_ok=False)
          commands = {
            'python': [sys.executable, 'tools/diagnose_reproduction.py', '--output', str(root/'python')],
            'blender': ['blender','-b','--python-exit-code','1','--python','tools/diagnose_reproduction.py','--','--output',str(root/'blender')],
          }
          for key, command in commands.items():
              process = subprocess.run(command, capture_output=True, text=True, timeout=300)
              (root/f'{key}.log').write_text(process.stdout+process.stderr)
              print('ENVIRONMENT', key, 'EXIT', process.returncode)
              print(process.stdout); print(process.stderr)
          # The original test failure remains failure, regardless of diagnostics.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: factory-full-regression-results
          path: |
            out/ci/*.xml
            out/ci/*.log
            out/ci/*.txt
            out/ci/*.sha256
            out/ci/reproduction/**/*.json
            out/ci/reproduction/**/*.log
          retention-days: 14
  candidate-acceptance:
    # Independent diagnostics, not permission to merge while contracts fail.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        group: [locomotion, supported, transitions]
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - name: Compile current programs and require actual final acceptance
        run: python tools/verify_catalog.py --group "$GROUP" --output "out/catalog-$GROUP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: factory-catalog-${{ matrix.group }}
          path: |
            out/catalog-*/**/*.json
            out/catalog-*/*.log
            out/catalog-*/*/*.glb
          if-no-files-found: error
          retention-days: 14
  native-review:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        recipe: [walk.v2, reverse-walk.v3, run.v3, sprint.v3]
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      RECIPE: ${{ matrix.recipe }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: bash tools/ci_setup_blender.sh
      - name: Render native-time multi-view candidates and preserve rejection
        run: python tools/build_showcase.py --output out/review --render --recipes "$RECIPE" --views side front rear three-quarter --mode root_motion --fps 60
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-review-${{ matrix.recipe }}
          path: |
            out/review/showcase.json
            out/review/previews/**/*.mp4
            out/review/previews/**/cover.png
            out/review/previews/**/render-receipt.json
            out/review/previews/**/timeline.json
            out/review/previews/**/camera.json
            out/review/previews/**/*.log
            out/review/*.log
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-${{ matrix.recipe }}
          path: |
            out/review/*/*.glb
            out/review/*/*.json
            out/review/previews/**/motion.fbx
          if-no-files-found: error
          retention-days: 14
