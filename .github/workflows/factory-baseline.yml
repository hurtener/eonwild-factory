name: Factory baseline
on:
  push:
    branches: [feat/v9-factory-baseline]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared engine and test dependencies
        run: python -m pip install -e . pytest==9.1.1
      - name: Baseline tests and source audit
        env:
          PYTHONPATH: src
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, tarfile
          root = pathlib.Path.cwd()
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'factory-baseline'
          output.mkdir()
          result = subprocess.run(['python','-m','pytest','tests','-q','--ignore=tests/test_integration.py'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=600)
          (output / 'baseline-pytest.txt').write_text(result.stdout)
          print(result.stdout[-14000:])
          entries = []
          files = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with tarfile.open(output / 'compact-source.tar.gz', 'w:gz') as tar:
              for name in files:
                  if not name:
                      continue
                  path = root / name
                  row = {'path': name, 'size': path.stat().st_size}
                  keep = path.suffix.lower() in {'.py','.toml','.lock','.yaml','.yml'} or name in {'.gitignore','.gitattributes'}
                  keep = keep or (path.suffix.lower() in {'.json','.md'} and path.stat().st_size < 60000)
                  if keep:
                      row['sha256'] = hashlib.sha256(path.read_bytes()).hexdigest()
                      tar.add(path, arcname=name, recursive=False)
                  entries.append(row)
          (output / 'inventory.json').write_text(json.dumps({'head': subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(), 'baseline_test_returncode': result.returncode, 'files': entries}, indent=2))
          for path in sorted(root.glob('src/**/*.py')):
              text = path.read_text()
              if 'procedural-animation-toolkit' in text or 'build/V9-' in text:
                  print('ACTIVE_DEPENDENCY', path.relative_to(root))
          for folder in ('procedural-animation-toolkit(v8)', 'procedural-animation-toolkit(v8.1)', 'procedural-animation-toolkit(v8.2)'):
              print('RETIREMENT_CANDIDATE',folder)
              for path in list(root.glob('src/**/*.py')) + list(root.glob('tests/*.py')) + list(root.glob('profiles/**/*.json')) + list(root.glob('catalog/**/*.json')):
                  if folder in path.read_text():
                      print('REFERENCED_BY',path.relative_to(root))
          print('BASELINE_RETURN_CODE', result.returncode)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-baseline-audit
          path: ${{ runner.temp }}/factory-baseline/
          retention-days: 7
