name: Factory verification
on:
  push:
    branches: [main, feat/v9-factory-baseline, feat/motion-quality-and-breadth]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - name: Confirm runner execution
        run: |
          printf 'EONWILD_RUNNER_EXECUTION_OK\n'
          date -u
          python3 --version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest==9.1.1
      - name: Install the recorded Blender version
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender-download"
          cd "$RUNNER_TEMP/blender-download"
          curl --fail --location --retry 2 https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz -o blender-5.2.0-linux-x64.tar.xz
          curl --fail --location --retry 2 https://download.blender.org/release/Blender5.2/blender-5.2.0.sha256 -o blender-5.2.0.sha256
          grep -E ' [*]?blender-5.2.0-linux-x64.tar.xz$' blender-5.2.0.sha256 > selected.sha256
          test "$(wc -l < selected.sha256)" -eq 1
          sha256sum --check selected.sha256
          tar -xJf blender-5.2.0-linux-x64.tar.xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-5.2.0-linux-x64" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6
      - name: Full regression suite including historical integration
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/ci
          git config user.name 'Eonwild regression runner'
          git config user.email 'eonwild-regression@example.invalid'
          blender --version > out/ci/blender-version.txt
          python -m pip freeze > out/ci/python-packages.txt
          cp "$RUNNER_TEMP/blender-download/selected.sha256" out/ci/blender-archive.sha256
          git rev-parse HEAD > out/ci/tested-source.txt
          python -m pytest tests -q --tb=short --junitxml=out/ci/full-tests.xml 2>&1 | tee out/ci/full-tests.log
      - name: Preserve exact legacy build diagnostics on regression failure
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        shell: python
        run: |
          import pathlib, subprocess, sys
          root = pathlib.Path('out/ci/legacy-diagnostic')
          root.mkdir(parents=True, exist_ok=True)
          result = subprocess.run([sys.executable, '-m', 'eonwild_motion', 'build', '--profile', 'working', '--work-root', str(root)], capture_output=True, text=True)
          (root / 'command.log').write_text(result.stdout + result.stderr)
          print(result.stdout, result.stderr)
          for path in root.rglob('blender-build.log'):
              print('BLENDER_DIAGNOSTIC', path)
              print(path.read_text(errors='replace')[-12000:])
          # The failing pytest step remains failed, even if this diagnostic succeeds.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: factory-full-regression-results
          path: |
            out/ci/*.xml
            out/ci/*.log
            out/ci/*.txt
            out/ci/*.sha256
            out/ci/legacy-diagnostic/**/*.log
            out/ci/legacy-diagnostic/**/run-report.json
          if-no-files-found: warn
          retention-days: 14
  candidate-acceptance:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - name: Compile and require final technical acceptance for current catalog
        shell: python
        run: |
          import json, pathlib, subprocess, sys
          names = ['walk.v2', 'fast-walk.v1', 'reverse-walk.v3', 'run.v3', 'sprint.v3', 'idle.v1', 'alert.v1', 'call.v1', 'bite-miss.v1', 'feeding.v1', 'walk-start.v1', 'walk-stop.v1', 'reverse-walk-start.v1', 'reverse-walk-stop.v1', 'run-start.v1', 'run-stop.v1', 'sprint-start.v1', 'sprint-stop.v1']
          output = pathlib.Path('out/catalog-verification')
          output.mkdir(parents=True, exist_ok=False)
          results = []
          for name in names:
              package = output / name
              compile_run = subprocess.run([sys.executable, '-m', 'eonwild_motion.factory', 'compile', '--recipe', f'recipes/heavy-biped/{name}.json', '--output', str(package)], capture_output=True, text=True)
              (output / f'{name}.compile.log').write_text(compile_run.stdout + compile_run.stderr)
              row = {'recipe': name, 'compile_exit': compile_run.returncode, 'verify_exit': None}
              if compile_run.returncode == 0:
                  verification = subprocess.run([sys.executable, '-m', 'eonwild_motion.factory', 'verify', str(package)], capture_output=True, text=True)
                  (output / f'{name}.verify.log').write_text(verification.stdout + verification.stderr)
                  row['verify_exit'] = verification.returncode
              results.append(row)
              print(json.dumps(row), flush=True)
          (output / 'results.json').write_text(json.dumps({'results': results, 'visual_review': 'NOT_RUN', 'unity_validation': 'NOT_RUN'}, indent=2) + '\n')
          if any(row['compile_exit'] != 0 or row['verify_exit'] != 0 for row in results):
              sys.exit('Catalog technical acceptance failed; generation is not approval.')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: factory-catalog-acceptance
          path: |
            out/catalog-verification/**/*.json
            out/catalog-verification/*.log
          if-no-files-found: error
          retention-days: 14
