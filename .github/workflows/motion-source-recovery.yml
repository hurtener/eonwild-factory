name: Temporary motion session recovery
on:
  push:
    branches: [feat/motion-quality-and-breadth]
    paths: [.github/workflows/motion-source-recovery.yml]
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          show-progress: false
      - name: Apply inspected source repairs
        id: publish
        env:
          PYTHONPATH: src
        run: |
          python .github/motion-quality-repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git rm .github/motion-quality-repair.py
          git commit -m 'fix: stabilize articulated toe branches and audit both skinned exports'
          git push origin HEAD:refs/heads/feat/motion-quality-and-breadth
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  tests:
    needs: repair
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.repair.outputs.sha }}
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest==9.1.1
      - name: Behavior and adversarial contracts
        run: python -m pytest tests/test_behavior_programs.py -q --tb=short --junitxml=out/behavior-tests.xml
      - name: Full regression attempt with explicit environment failures
        if: always()
        run: python -m pytest tests -q --tb=short --junitxml=out/full-tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: contact-repair-tests
          path: out/*tests.xml
          retention-days: 14
  compile:
    needs: repair
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        recipe: [walk.v2, idle.v1, run-start.v1]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONPATH: src
      RECIPE: ${{ matrix.recipe }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.repair.outputs.sha }}
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - name: Compile actual skinned candidate at native timing
        shell: python
        run: |
          import os,json,pathlib,traceback,time
          from eonwild_motion.factory.compiler import compile_recipe
          directory=pathlib.Path('out')/os.environ['RECIPE']
          began=time.monotonic()
          result=compile_recipe(pathlib.Path('recipes/heavy-biped')/(os.environ['RECIPE']+'.json'),root=pathlib.Path.cwd(),output=directory)
          print('COMPILED',json.dumps(result),'ELAPSED_S',time.monotonic()-began)
          validation=json.loads((directory/'validation.json').read_text())
          print('VALIDATION',json.dumps(validation))
          receipt=json.loads((directory/'solver-receipt.json').read_text())
          print('REFINEMENT',json.dumps(receipt.get('skin_target_refinement',{})))
          # Leave failed candidates available for diagnosis; never promote them.
          if validation['technical_status']!='PASS': raise SystemExit(2)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: contact-repair-${{ matrix.recipe }}
          path: out
          retention-days: 14
