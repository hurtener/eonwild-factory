name: Temporary motion session recovery
on:
  push:
    branches: [feat/motion-quality-and-breadth]
    paths: [.github/workflows/motion-source-recovery.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Inspect complete patch boundaries and V9 walk evidence
        shell: python
        run: |
          import base64, hashlib, lzma, pathlib, subprocess, re
          parts=sorted(pathlib.Path('.github').glob('motion-session-part-*.b64'))
          raw=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='1b2c4beeede55a85322ba3dc5bb7812cd0b1abfe5724830fdd4442a88052e07d'
          dec=lzma.LZMADecompressor(memlimit=256*1024*1024)
          prefix=dec.decompress(raw,max_length=16*1024*1024).decode('utf-8')
          print('RECOVERY_STATUS',len(prefix),dec.eof)
          for part in re.split(r'(?m)(?=^diff --git )',prefix):
              if not part: continue
              print('SECTION',part.splitlines()[0],len(part),'INDEX',next((x for x in part.splitlines() if x.startswith('index ')),''))
          print('TAIL_BEGIN');print(prefix[25000:]);print('TAIL_END')
          paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          print('WALK_REPORT_PATHS')
          for path in paths:
              if any(w in path.upper() for w in ('WALK','THREE-MOTION')) and path.endswith(('.md','.json')) and (path.startswith(('reports/','catalog/','profiles/')) or ('V9' in path and any(w in path for w in ('profile','manifest','receipt','validation')))):
                  print(path)
          print('APPROVAL_TEXT')
          matches=subprocess.run(['git','grep','-n','-i','-E','approved.*walk|walk.*approved|accepted.*walk|walk.*accepted','--','reports/*.md','catalog/*.json','docs/*.md'],capture_output=True,text=True)
          print(matches.stdout[:25000])
          for path in ('catalog/programs/heavy-biped.walk.v2.json','catalog/performance/heavy-biped.walk.v2.json','catalog/programs/heavy-biped.reverse-walk.v3.json','catalog/programs/heavy-biped.run.v3.json','catalog/programs/heavy-biped.sprint.v3.json'):
              print('PROFILE',path);print(pathlib.Path(path).read_text())
