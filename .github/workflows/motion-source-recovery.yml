name: Temporary motion session recovery
on:
  push:
    branches: [feat/motion-quality-and-breadth]
    paths: [.github/workflows/motion-source-recovery.yml]
permissions:
  contents: write
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest==9.1.1
      - name: Recover actual review files and native measurements
        shell: python
        run: |
          from pathlib import Path
          import subprocess,json,hashlib,shutil,sys,xml.etree.ElementTree as ET
          dest=Path('reports/MOTION-QUALITY-AND-BREADTH-002')
          verification=dest/'verification'
          saved=json.loads((verification/'run.json').read_text())
          subprocess.run(['gh','run','download','34046652734','--repo','hurtener/eonwild-factory','--dir','/tmp/actual-motion-evidence'],check=True)
          added=[]
          for rel,expected in saved['files'].items():
              src=Path('/tmp/actual-motion-evidence')/rel
              assert hashlib.sha256(src.read_bytes()).hexdigest()==expected,rel
              # Avoid nested ignored `out` directories in checked-in evidence.
              parts=[p for p in Path(rel).parts if p!='out']
              target=verification.joinpath(*parts)
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(src,target);added.append(str(target))
          saved['files']={str(Path(*[p for p in Path(rel).parts if p!='out'])):value for rel,value in saved['files'].items()}
          (verification/'run.json').write_text(json.dumps(saved,indent=2)+'\n')
          for path in verification.rglob('full-tests.xml'):
              document=ET.parse(path).getroot()
              print('JUNIT_COUNTS',[s.attrib for s in document.iter('testsuite')])
          subprocess.run(['gh','run','download','34045100968','--repo','hurtener/eonwild-factory','--name','contact-repair-walk.v2','--dir','/tmp/measured-candidate'],check=True)
          sys.path.insert(0,'tools')
          from measure_motion_reference import measure
          from eonwild_motion.glb.container import Glb
          from eonwild_motion.factory.quality import geometry_height
          recipe=json.loads(Path('recipes/heavy-biped/walk.v2.json').read_text())
          roles=json.loads(Path(recipe['rig']['path']).read_text())['roles']
          candidate=next(Path('/tmp/measured-candidate').rglob('root_motion.glb'))
          ref=next(Path('build/V9-NARROW-GAUGE-WALK-002').rglob('*.glb'))
          for key,path,clip in [('v9',ref,'PROC_WALK_RELAXED_V8_1_RESPIN_ROOTMOTION'),('candidate',candidate,'heavy-biped.walk.v2.root_motion')]:
              result=measure(path,clip=clip,roles=roles,forward_axis=recipe['forward_axis'])
              target=dest/'native-measurements'/f'{key}.json';target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(json.dumps(result,indent=2)+'\n');added.append(str(target))
              print('MEASUREMENTS',key,json.dumps(result))
          for name in ('validation.json','solver-receipt.json','inputs.lock.json','plan.json'):
              target=dest/'native-measurements'/('candidate-'+name)
              shutil.copyfile(candidate.parent/name,target);added.append(str(target))
          source=Glb.from_bytes(Path(recipe['source']['path']).read_bytes())
          print('SOURCE_BODY_HEIGHT_M',geometry_height(source,roles,recipe['up_axis']))
          subprocess.run(['git','add','-f','--',*added,str(verification/'run.json')],check=True)
      - name: Install verified recorded Blender and reproduce the exact baseline fixture
        run: |
          gh run download 34041514733 --repo hurtener/eonwild-factory --name motion-recorded-blender-52 --dir "$RUNNER_TEMP/recorded-blender"
          cd "$RUNNER_TEMP/recorded-blender"
          grep 'blender-5.2.0-linux-x64.tar.xz$' blender-5.2.0.sha256 | sha256sum --check
          tar -xJf blender-5.2.0-linux-x64.tar.xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-5.2.0-linux-x64" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libxrender1 libxi6 libxfixes3 libxkbcommon0 libsm6
      - name: Capture native build logs without skipping the failure
        shell: python
        run: |
          import pathlib,subprocess,json,shutil,os
          target=pathlib.Path('reports/MOTION-QUALITY-AND-BREADTH-002/legacy-fixture');target.mkdir(parents=True,exist_ok=True)
          run=subprocess.run(['python','-m','eonwild_motion','build','--profile','working','--work-root','/tmp/legacy-fixture'],capture_output=True,text=True)
          (target/'command.log').write_text(run.stdout+run.stderr)
          print('BUILD_EXIT',run.returncode);print(run.stdout);print(run.stderr)
          for path in pathlib.Path('/tmp/legacy-fixture').rglob('*'):
              if not path.is_file() or path.suffix not in ('.log',) and path.name not in ('run-report.json','validation.json'):continue
              print('DIAGNOSTIC',path);print(path.read_text(errors='replace')[-24000:])
              out=target/path.relative_to('/tmp/legacy-fixture');out.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(path,out)
          (target/'status.json').write_text(json.dumps({'source_sha':os.environ['GITHUB_SHA'],'exit_code':run.returncode,'unity':'NOT_RUN'},indent=2)+'\n')
          subprocess.run(['git','add','-f','--',str(target)],check=True)
      - name: Commit actual evidence only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'test: retain actual native motion reviews and exact baseline build diagnostics'
          git push origin HEAD:refs/heads/feat/motion-quality-and-breadth
