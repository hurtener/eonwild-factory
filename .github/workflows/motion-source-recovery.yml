name: Temporary motion session recovery
on:
  push:
    branches: [feat/motion-quality-and-breadth]
    paths: [.github/workflows/motion-source-recovery.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Recover recorded Blender 5.2.0 release
        run: |
          mkdir -p /tmp/motion-blender-52
          cd /tmp/motion-blender-52
          curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz -o blender-5.2.0-linux-x64.tar.xz
          curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.0.sha256 -o blender-5.2.0.sha256
          grep 'blender-5.2.0-linux-x64.tar.xz$' blender-5.2.0.sha256 | sha256sum --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: motion-recorded-blender-52
          path: /tmp/motion-blender-52
          compression-level: 0
          retention-days: 3
