name: Temporary motion session recovery
on:
  push:
    branches: [feat/motion-quality-and-breadth]
    paths: [.github/workflows/motion-source-recovery.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch official pinned glTF Validator
        run: |
          mkdir -p /tmp/motion-validator
          curl --fail --location --retry 3 https://github.com/KhronosGroup/glTF-Validator/releases/download/2.0.0-dev.3.10/gltf_validator-2.0.0-dev.3.10-linux64.tar.xz -o /tmp/motion-validator/validator.tar.xz
          cd /tmp/motion-validator
          sha256sum validator.tar.xz > SHA256SUMS
          tar -xf validator.tar.xz
          ./gltf_validator --version > version.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: motion-official-validator
          path: /tmp/motion-validator
          retention-days: 3
